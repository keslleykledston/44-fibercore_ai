# FiberCore AI — vhost do nginx do host (ADR-0016). Instalar:
#   sudo cp infra/deploy/nginx/fibercore.devops.k3gsolutions.com.br.conf /etc/nginx/conf.d/fibercore.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Certificado: certbot (webroot /var/www/html), renovação automática do certbot.timer.
# Backend: Caddy do compose (profile public) em 127.0.0.1:18480.

limit_req_zone $binary_remote_addr zone=fibercore_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fibercore_api:10m rate=20r/s;
limit_req_status 429;

upstream fibercore_proxy {
    server 127.0.0.1:18480;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name fibercore.devops.k3gsolutions.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fibercore.devops.k3gsolutions.com.br;

    ssl_certificate     /etc/letsencrypt/live/fibercore.devops.k3gsolutions.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fibercore.devops.k3gsolutions.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5m;
    server_tokens off;

    access_log /var/log/nginx/fibercore.access.log;
    error_log  /var/log/nginx/fibercore.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # defesa em profundidade: rotas internas nunca saem daqui (o Caddy também bloqueia)
    location ~ ^/(internal|metrics|docs|openapi\.json|livez|readyz)(/|$) { return 404; }

    # força bruta de login: 10 req/min por IP (o lockout por conta continua na API)
    location = /bff/login {
        limit_req zone=fibercore_login burst=5 nodelay;
        include /etc/nginx/fibercore_proxy.inc;
        proxy_pass http://fibercore_proxy;
    }
    location ~ ^/api/v1/auth/(token|service-token)$ {
        limit_req zone=fibercore_login burst=5 nodelay;
        include /etc/nginx/fibercore_proxy.inc;
        proxy_pass http://fibercore_proxy;
    }
    location /api/ {
        limit_req zone=fibercore_api burst=40 nodelay;
        include /etc/nginx/fibercore_proxy.inc;
        proxy_pass http://fibercore_proxy;
    }
    location / {
        include /etc/nginx/fibercore_proxy.inc;
        proxy_pass http://fibercore_proxy;
    }
}

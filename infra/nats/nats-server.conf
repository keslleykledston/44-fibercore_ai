# NATS com TLS mútuo + ACL por papel (ADR-0044). OPT-IN: o Compose padrão NÃO usa este arquivo (ver infra/compose/nats-secure.compose.override.yaml).
# Sem segredos aqui: só permissões. Certificados vêm de scripts/nats-tls.sh (fora do repositório) montados em /etc/nats/tls.
# Quem fala NATS hoje: SÓ o relay do outbox (publica eventos) e o consumer (lê e confirma). A API (api-core) e o Edge Go NÃO se conectam ao NATS
# (a API grava no outbox; o Edge fala HTTPS com a API): por isso não existe identidade para eles — usuário que não existe não vaza.
port: 4222
http_port: 8222          # monitor em HTTP, sem autenticação: só na rede interna do Compose (nunca publicar). Usado pelo healthcheck e por /readyz da API.
jetstream { store_dir: "/data" }

tls {
  cert_file: "/etc/nats/tls/server.pem"
  key_file: "/etc/nats/tls/server.key"
  ca_file: "/etc/nats/tls/ca.pem"
  verify: true
  verify_and_map: true   # a identidade do cliente é o SAN DNS do certificado (fibercore-<papel>); certificado de outra CA ou sem usuário aqui = recusado
  timeout: 3
}

authorization {
  users = [
    {
      user: "fibercore-relay"
      permissions: {
        publish: {
          allow: [
            "fibercore.events.>"                                   # eventos do outbox (publish do JetStream é um publish normal no subject)
            "$JS.API.STREAM.INFO.FIBERCORE_EVENTS", "$JS.API.STREAM.INFO.FIBERCORE_DLQ"
            "$JS.API.STREAM.CREATE.FIBERCORE_EVENTS", "$JS.API.STREAM.CREATE.FIBERCORE_DLQ"      # ensure_streams() roda em todo processo
            "$JS.API.STREAM.UPDATE.FIBERCORE_EVENTS", "$JS.API.STREAM.UPDATE.FIBERCORE_DLQ"
          ]
        }
        subscribe: { allow: ["_INBOX.relay.>"] }                   # respostas só no próprio prefixo (NATS_INBOX_PREFIX=_INBOX.relay)
      }
    }
    {
      user: "fibercore-consumer"
      permissions: {
        publish: {
          allow: [
            "fibercore.dlq.>"                                      # mensagem esgotada vai para a DLQ
            "$JS.ACK.FIBERCORE_EVENTS.>"                           # ack/nak/term das entregas
            "$JS.API.STREAM.INFO.FIBERCORE_EVENTS", "$JS.API.STREAM.INFO.FIBERCORE_DLQ"
            "$JS.API.STREAM.CREATE.FIBERCORE_EVENTS", "$JS.API.STREAM.CREATE.FIBERCORE_DLQ"
            "$JS.API.STREAM.UPDATE.FIBERCORE_EVENTS", "$JS.API.STREAM.UPDATE.FIBERCORE_DLQ"
            "$JS.API.CONSUMER.INFO.FIBERCORE_EVENTS.audit-projection"
            "$JS.API.CONSUMER.CREATE.FIBERCORE_EVENTS.audit-projection.>"      # forma usada por pull_subscribe(filtro) no nats-py 2.16 do lock
            "$JS.API.CONSUMER.MSG.NEXT.FIBERCORE_EVENTS.audit-projection"
          ]
        }
        subscribe: { allow: ["_INBOX.consumer.>"] }
      }
    }
  ]
}

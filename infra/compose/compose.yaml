name: fibercore-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fibercore
      POSTGRES_DB: fibercore
      POSTGRES_PASSWORD: ${FIBERCORE_DB_PASSWORD:?Set FIBERCORE_DB_PASSWORD in shell or .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fibercore -d fibercore"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 30s
      timeout: 8s
      retries: 3
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # development only: NATS must be configured with TLS, credentials and ACL before production.
  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      ADMIN_DATABASE_URL: postgresql://fibercore:${FIBERCORE_DB_PASSWORD}@postgres:5432/fibercore
      APP_DB_PASSWORD: ${FIBERCORE_APP_DB_PASSWORD:?Set FIBERCORE_APP_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${FIBERCORE_WORKER_DB_PASSWORD:?Set FIBERCORE_WORKER_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control]
    restart: "no"
    security_opt: [no-new-privileges:true]
    read_only: true
  api-core:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql://fibercore_app:${FIBERCORE_APP_DB_PASSWORD}@postgres:5432/fibercore
      JWT_SECRET: ${FIBERCORE_JWT_SECRET:?Set FIBERCORE_JWT_SECRET (>=32 chars)}
      MODULE_MANIFEST: /app/configs/modules.yaml
      NATS_MONITOR_URL: http://nats:8222
      PII_HMAC_KEY: ${FIBERCORE_PII_HMAC_KEY:?Set FIBERCORE_PII_HMAC_KEY (>=32 chars)}
      TRUSTED_PROXY: ${FIBERCORE_TRUSTED_PROXY:-true}  # api-core is reachable only via web/Caddy (internal network); client IP comes from X-Forwarded-For
      JOB_SIGNING_KEY: ${FIBERCORE_JOB_SIGNING_KEY:-}  # empty => job dispatch disabled (fail closed)
    ports:
      - "127.0.0.1:${FIBERCORE_API_PORT:-18420}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    networks: [control]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
  outbox-relay:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.workers.relay"]
    environment:
      WORKER_DATABASE_URL: postgresql://fibercore_worker:${FIBERCORE_WORKER_DB_PASSWORD}@postgres:5432/fibercore
      NATS_URL: nats://nats:4222
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}
    networks: [control]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
  event-consumer:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.events.consumer"]
    environment:
      DATABASE_URL: postgresql://fibercore_app:${FIBERCORE_APP_DB_PASSWORD}@postgres:5432/fibercore
      NATS_URL: nats://nats:4222
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}
    networks: [control]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
  web:
    # Frontend Next.js (profile "public"). Fala com a API pela rede interna; o token fica em cookie HttpOnly (ADR-0014).
    profiles: [public]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api-core:8000
      FIBERCORE_INSECURE_COOKIES: ${FIBERCORE_INSECURE_COOKIES:-0}
    depends_on:
      api-core: {condition: service_healthy}
    networks: [control]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
  proxy:
    # Profile "public": reverse proxy do frontend/API (ADR-0012). NÃO sobe por padrão. Só o proxy é publicável.
    profiles: [public]
    image: caddy:2.8-alpine
    volumes:
      - ../deploy/${FIBERCORE_CADDYFILE:-Caddyfile.dev}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:${FIBERCORE_PROXY_HTTP_PORT:-18480}:80"
    depends_on:
      api-core: {condition: service_healthy}
      web: {condition: service_healthy}
    networks: [control]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
networks:
  control:
    driver: bridge
volumes:
  pg_data: {}
  nats_data: {}
  caddy_data: {}
  caddy_config: {}

name: fibercore-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fibercore
      POSTGRES_DB: fibercore
      POSTGRES_PASSWORD: ${FIBERCORE_DB_PASSWORD:?Set FIBERCORE_DB_PASSWORD in shell or .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fibercore -d fibercore"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 30s
      timeout: 8s
      retries: 3
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # development only: NATS must be configured with TLS, credentials and ACL before production.
  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      ADMIN_DATABASE_URL: postgresql://fibercore:${FIBERCORE_DB_PASSWORD}@postgres:5432/fibercore
      APP_DB_PASSWORD: ${FIBERCORE_APP_DB_PASSWORD:?Set FIBERCORE_APP_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${FIBERCORE_WORKER_DB_PASSWORD:?Set FIBERCORE_WORKER_DB_PASSWORD}
      RBAC_DB_PASSWORD: ${FIBERCORE_RBAC_DB_PASSWORD:?Set FIBERCORE_RBAC_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control]
    restart: "no"
    security_opt: [no-new-privileges:true]
    read_only: true
  api-core:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql://fibercore_app:${FIBERCORE_APP_DB_PASSWORD}@postgres:5432/fibercore
      RBAC_DATABASE_URL: postgresql://fibercore_rbac:${FIBERCORE_RBAC_DB_PASSWORD}@postgres:5432/fibercore  # the only connection that may change a membership role (ADR-0031)
      JWT_SECRET: ${FIBERCORE_JWT_SECRET:?Set FIBERCORE_JWT_SECRET (>=32 chars)}
      MODULE_MANIFEST: /app/configs/modules.yaml
      NATS_MONITOR_URL: http://nats:8222
      PII_HMAC_KEY: ${FIBERCORE_PII_HMAC_KEY:?Set FIBERCORE_PII_HMAC_KEY (>=32 chars)}
      TRUSTED_PROXY: ${FIBERCORE_TRUSTED_PROXY:-true}  # api-core is reachable only via web/Caddy (internal network); client IP comes from X-Forwarded-For
      JOB_SIGNING_KEY: ${FIBERCORE_JOB_SIGNING_KEY:-}  # empty => job dispatch disabled (fail closed)
      EDGE_INGEST_LIMIT: ${FIBERCORE_EDGE_INGEST_LIMIT:-capable}  # per-agent intake limit: capable (only Edges that announce they understand 429) | all (set once EVERY Edge is updated) | off
      MFA_ENCRYPTION_KEY: ${FIBERCORE_MFA_ENCRYPTION_KEY:-}  # Fernet key; empty => MFA enrolment disabled (fail closed)
      MFA_RECENT_ENFORCE: ${FIBERCORE_MFA_RECENT_ENFORCE:-false}  # ADR-0031 (owner decision 2026-10-30: MFA at login only; true = permissions marked `mfa_recent` need a second factor from the last MFA_RECENT_SECONDS (10 min)
      MFA_RECENT_SECONDS: ${FIBERCORE_MFA_RECENT_SECONDS:-600}
      MFA_REQUIRED_ROLES: ${FIBERCORE_MFA_REQUIRED_ROLES:-}  # e.g. isp_admin: those roles must enrol MFA (ADR-0017); empty = policy off; typos stop the API at boot
      JWT_KID: ${FIBERCORE_JWT_KID:-k1}  # rotation: set new JWT_SECRET+KID, move the old pair to *_PREVIOUS until tokens expire
      JWT_SECRET_PREVIOUS: ${FIBERCORE_JWT_SECRET_PREVIOUS:-}
      JWT_KID_PREVIOUS: ${FIBERCORE_JWT_KID_PREVIOUS:-}
      METRICS_TOKEN: ${FIBERCORE_METRICS_TOKEN:-}  # ADR-0042: empty => GET /metrics answers 404 (off); >=32 chars => Prometheus (profile "observability") may scrape it with this bearer token
    ports:
      - "127.0.0.1:${FIBERCORE_API_PORT:-18420}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    networks: [control]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
  outbox-relay:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.workers.relay"]
    environment:
      WORKER_DATABASE_URL: postgresql://fibercore_worker:${FIBERCORE_WORKER_DB_PASSWORD}@postgres:5432/fibercore
      NATS_URL: nats://nats:4222
      HEARTBEAT_FILE: /tmp/hb
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}
    networks: [control]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.heartbeat", "/tmp/hb", "60"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
  job-sweeper:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.workers.sweeper"]
    environment:
      WORKER_DATABASE_URL: postgresql://fibercore_worker:${FIBERCORE_WORKER_DB_PASSWORD}@postgres:5432/fibercore
      HEARTBEAT_FILE: /tmp/hb
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [control]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.heartbeat", "/tmp/hb", "180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
  event-consumer:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.events.consumer"]
    environment:
      DATABASE_URL: postgresql://fibercore_app:${FIBERCORE_APP_DB_PASSWORD}@postgres:5432/fibercore
      NATS_URL: nats://nats:4222
      HEARTBEAT_FILE: /tmp/hb
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}
    networks: [control]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.heartbeat", "/tmp/hb", "60"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
  web:
    # Frontend Next.js (profile "public"). Fala com a API pela rede interna; o token fica em cookie HttpOnly (ADR-0014).
    profiles: [public]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api-core:8000
      FIBERCORE_INSECURE_COOKIES: ${FIBERCORE_INSECURE_COOKIES:-0}
    depends_on:
      api-core: {condition: service_healthy}
    networks: [control]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
  proxy:
    # Profile "public": reverse proxy do frontend/API (ADR-0012). NÃO sobe por padrão. Só o proxy é publicável.
    profiles: [public]
    image: caddy:2.8-alpine
    volumes:
      - ../deploy/${FIBERCORE_CADDYFILE:-Caddyfile.dev}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:${FIBERCORE_PROXY_HTTP_PORT:-18480}:80"
    depends_on:
      api-core: {condition: service_healthy}
      web: {condition: service_healthy}
    networks: [control]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
  # ---- Observability (ADR-0042, docs/operations/OBSERVABILITY.md). NOTHING below starts by default: `--profile observability`. Host ports are loopback only; no secret is in this file. ----
  fibercore-exporter:
    # What the API process cannot know about itself: Edge/OLT collection age, outbox backlog, jobs by state (aggregates only, through app_metrics_snapshot()), backup age and disk free. Internal port only.
    profiles: [observability]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.workers.metrics_exporter"]
    environment:
      WORKER_DATABASE_URL: postgresql://fibercore_worker:${FIBERCORE_WORKER_DB_PASSWORD}@postgres:5432/fibercore
      BACKUP_DIR: /backups
      BACKUP_GLOB: ${FIBERCORE_BACKUP_GLOB:-fibercore-prod-*.dump.done}
    volumes:
      - type: bind
        source: ${FIBERCORE_BACKUP_DIR:-../observability/no-backup-dir}  # the host backup directory, READ-ONLY (only the mtime of the *.done markers is read); the default is an empty dir, which makes the backup alert fire on purpose
        target: /backups
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [control]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
  nats-exporter:
    # JetStream consumer lag (num_pending / ack_pending) and server health from the NATS monitor port (already enabled with -m 8222). Internal port only.
    profiles: [observability]
    image: natsio/prometheus-nats-exporter:0.20.1@sha256:4fbf6dacb84780a45a1c3af9b1080c69451a288d20902deae671b80717bb8f61
    command: ["-addr", "0.0.0.0", "-port", "7777", "-varz", "-healthz", "-jsz=all", "http://nats:8222"]
    user: "65534:65534"
    depends_on:
      nats: {condition: service_healthy}
    networks: [control]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${FIBERCORE_PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${FIBERCORE_PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.listen-address=:9090
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    secrets:
      - source: fibercore_metrics_token   # read by `authorization.credentials_file` in prometheus.yml
        target: fibercore_metrics_token
        uid: "65534"
        gid: "65534"
        mode: 0400
    ports:
      - "127.0.0.1:${FIBERCORE_PROMETHEUS_PORT:-19090}:9090"
    networks: [control]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # no `read_only`: Compose cannot inject an environment-sourced secret into a read-only root (it would need `file:`, which keeps the host owner/mode and the non-root user could not read it)
    mem_limit: 1g
  grafana:
    profiles: [observability]
    image: grafana/grafana:12.4.15@sha256:2894082f6cf7081aefdc1389265c04000812309208c190d75e8c65f7a30e4b7e
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password  # never a literal value here
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_LOG_MODE: console
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/fibercore-dashboards:ro
    secrets:
      - source: grafana_admin_password
        target: grafana_admin_password
        uid: "472"
        gid: "472"
        mode: 0400
    ports:
      - "127.0.0.1:${FIBERCORE_GRAFANA_PORT:-19300}:3000"
    depends_on:
      prometheus: {condition: service_healthy}
    networks: [control]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]   # no `read_only`, same reason as prometheus
    mem_limit: 512m
secrets:
  # Values come from the ENVIRONMENT of the compose invocation (an env-file the operator keeps outside the repository: scripts/observability-init.sh creates it, mode 0600). Compose writes them
  # into the container as files owned by the service user (a `file:` secret would keep the host owner/mode and the non-root service could not read it). Only used when the profile starts.
  fibercore_metrics_token:
    environment: FIBERCORE_METRICS_TOKEN
  grafana_admin_password:
    environment: FIBERCORE_GRAFANA_ADMIN_PASSWORD
networks:
  control:
    driver: bridge
volumes:
  pg_data: {}
  nats_data: {}
  caddy_data: {}
  caddy_config: {}
  prometheus_data: {}
  grafana_data: {}

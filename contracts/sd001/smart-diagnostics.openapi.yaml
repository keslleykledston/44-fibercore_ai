openapi: 3.1.0
info:
  title: FiberCore SD-001 — sobreposição incremental da API (PROPOSTA, NÃO IMPLEMENTADA)
  version: 0.1.0-proposal
  description: >-
    NÃO é o contrato canônico: o canônico é contracts/fibercore-v2.openapi.yaml. Este arquivo descreve, por antecipação, o que o
    SD-001 acrescentará (ADR-0025). Nenhum destes caminhos existe na API hoje (tests/test_sd001_contracts.py garante isso e que nenhum
    colide com o contrato canônico). Cada caminho só é mesclado ao canônico no PR que o implementa, com as flags `smart_diagnostics_*`.
    Diferenças deliberadas em relação ao pacote: o recurso assíncrono é `diagnostic_jobs` (o `diagnostic_runs` existente é a execução
    síncrona e imutável de uma regra, ADR-0024); `/devices/{id}/capabilities` NÃO é criado porque `/cpes/{id}/capabilities` já existe.
    SD-PR-03 (ADR-0028) implementou `POST /diagnostics/jobs` e `GET /diagnostics/jobs/{job_id}`: seus caminhos foram para o contrato
    canônico (os esquemas compartilhados continuam aqui por serem usados pelos caminhos ainda não implementados; um teste impede divergência).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Diagnostics
  - name: Remediation
paths:
  /diagnostics/jobs/{job_id}/active-tests:
    post:
      operationId: requestActiveDiagnostic
      tags: [Diagnostics]
      summary: BLOQUEADO até ADR-SD-003. Teste ativo com orçamento e consentimento explícitos. diagnostics:run_active + flag smart_diagnostics_active_tests
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/JobId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActiveTestRequest'}
      responses:
        '202':
          description: Enfileirado, sujeito a capacidade validada, quota e RBAC
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiagnosticJobReceipt'}
        '403': {description: Sem permissão, flag desligada ou capacidade não homologada}
        '409': {description: Conflito de idempotência ou de bloqueio do dispositivo}
        '429': {description: Orçamento/cooldown}
  /diagnostics/jobs/{job_id}/proposals:
    get:
      operationId: listDiagnosticProposals
      tags: [Remediation]
      summary: Propostas CONSULTIVAS (não são autorização). diagnostics:propose + flag smart_diagnostics_remediation
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/JobId'}
      responses:
        '200':
          description: Propostas do job
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ActionProposal'}
        '403': {description: Sem permissão ou flag desligada}
        '404': {description: Job inexistente ou de outro tenant}
  /remediations/proposals/{proposal_id}/approvals:
    post:
      operationId: approveRemediationProposal
      tags: [Remediation]
      summary: Aprova UMA proposta imutável (vinculada a proposal_hash); NÃO executa. Reaproveita job_approvals
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/ProposalId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecision'}
      responses:
        '200':
          description: Política verificada, aprovação registrada, nada executado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalReceipt'}
        '403': {description: Sem permissão, autoaprovação onde há segregação ou flag desligada}
        '409': {description: Hash diferente, proposta expirada ou já decidida}
  /remediations/proposals/{proposal_id}/executions:
    post:
      operationId: enqueueApprovedRemediation
      tags: [Remediation]
      summary: Reavalia a política no servidor e entra no gate de jobs existente. Sem HOMOLOGATED_WRITES o resultado é sempre `blocked`
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/ProposalId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecutionIntent'}
      responses:
        '202':
          description: Aceito para pré-checagem; nenhuma execução garantida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionReceipt'}
        '403': {description: Sem permissão ou flag desligada}
        '409': {description: Aprovação expirada/consumida ou hash diferente}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    TenantId:
      name: X-Workspace-ID
      in: header
      required: true
      description: "Igual ao canônico, comparado à membership validada do token no servidor."
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Valor opaco, por exemplo um UUID. O código de jobs já impõe um padrão parecido; aqui sem dois-pontos para não aceitar MAC."
      schema: {type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    JobId:
      name: job_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    CreateDiagnosticJob:
      type: object
      additionalProperties: false
      required: [customer_id, mode]
      properties:
        customer_id: {type: string, format: uuid}
        service_id: {type: string, format: uuid}
        cpe_id: {type: string, format: uuid}
        mode: {type: string, enum: [passive, guided], description: 'ADR-0028: a implementação aceita só passive; guided fica para o PR que o implementa'}
        requested_domains:
          type: array
          uniqueItems: true
          items: {type: string, enum: [pon, wan, wifi, lan, internet, erp, bng]}
        ticket_id: {$ref: '#/components/schemas/OpaqueRef'}
    DiagnosticJobReceipt:
      type: object
      required: [job_id, status, created_at]
      properties:
        job_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, waiting_for_device, complete, partial, inconclusive, failed], description: 'queued/running/waiting_for_device: execução assíncrona (ativa, futura). complete/partial/inconclusive/failed: o job passivo, que só lê dado já retido, termina dentro do pedido (ADR-0028)'}
        created_at: {type: string, format: date-time}
    Evidence:
      type: object
      additionalProperties: false
      required: [evidence_id, source_type, status, captured_at]
      properties:
        evidence_id: {$ref: '#/components/schemas/OpaqueRef'}
        source_type: {type: string, enum: [olt, cpe_cwmp, cpe_usp, edge, endpoint, erp, bng]}
        status: {type: string, enum: [available, stale, unsupported, failed, inconclusive]}
        metric: {$ref: '#/components/schemas/MetricName'}
        value:
          description: Número ou estado da lista permitida; nunca texto livre (PSK, usuário PPPoE e MAC não passam por aqui)
          oneOf:
            - {type: number}
            - {$ref: '#/components/schemas/StateValue'}
            - {type: 'null'}
        unit: {type: string, enum: ['', dBm, dB, Mbps, ms, percent, seconds, count]}
        capture_side: {type: string, enum: [onu_rx, olt_rx, cpe, wan, lan, wifi_2g, wifi_5g]}
        captured_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        method: {type: string, enum: [snmp, cli, genieacs_nbi, usp, vendor_driver, vendor_driver_mock, mock_genieacs, unsupported]}
        confidence: {type: string, enum: [verified, observed, unverified]}
    SafeText:
      type: string
      maxLength: 1000
      pattern: '^(?!.*(([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}|([Ss]enha|[Pp]assword|[Pp]asswd|PSK|psk|[Pp]assphrase|[Ss]ecret|[Tt]oken|[Cc]have|[Pp]ppoe|[Uu]su[aá]rio|[Uu]ser(name)?)\s*[:=]))[\s\S]*$'
      description: >-
        Texto narrativo. Rejeita MAC e chave=valor de credencial, mas NÃO prova ausência de segredo: o controle real é a redação na origem
        e antes de persistir/exibir (ADR-SD-002/ADR-SD-006). Exibir como texto puro.
    FindingCategory:
      type: string
      enum: [PON_OPTICAL, PON_MASS_OUTAGE, ONU_OFFLINE, WAN_LINK, WAN_AUTH, WIFI_SIGNAL, WIFI_INTERFERENCE, LAN_PORT, CPE_STALE_DATA, ERP_STATUS, INCONCLUSIVE]
    OpaqueRef:
      type: string
      pattern: '^(?![0-9A-Fa-f]{2}([-:.]?[0-9A-Fa-f]{2}){5}$)[A-Za-z0-9_-]{1,64}$'
      description: Identificador opaco; rejeita o formato de MAC
    MetricName:
      type: string
      enum: [rx_optical_power, tx_optical_power, onu_status, wan_link_status, wan_connection_status, wan_download, wan_upload, associated_client_rssi, wifi_channel, wifi_band, wifi_radio_enabled, lan_port_status, latency_rtt, packet_loss, uptime_seconds]
    StateValue:
      type: string
      enum: [Up, Down, Connected, Connecting, Disconnected, Unconfigured, Enabled, Disabled, Error, Unknown, online, offline, los, dying_gasp, PendingDisconnect, Disconnecting, Initializing, Unavailable, Dormant, NotPresent, LowerLayerDown]
    Finding:
      type: object
      additionalProperties: false
      required: [category, certainty, evidence_ids, explanation]
      properties:
        category: {$ref: '#/components/schemas/FindingCategory'}
        certainty: {type: string, enum: [confirmed, likely, possible, insufficient_evidence]}
        evidence_ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/OpaqueRef'}
        explanation: {$ref: '#/components/schemas/SafeText'}
      allOf:
        - if:
            properties: {certainty: {enum: [confirmed, likely, possible]}}
          then:
            properties: {evidence_ids: {minItems: 1}}
    DiagnosticJob:
      type: object
      required: [job_id, status, data_quality, evidences, findings, created_at]
      properties:
        job_id: {type: string, format: uuid}
        run_id:
          type: [string, 'null']
          format: uuid
          description: diagnostic_runs gerado ao concluir (ADR-0024); nulo enquanto não houver execução de regra
        status: {type: string, enum: [queued, running, partial, complete, failed, cancelled, inconclusive]}
        data_quality: {type: string, enum: [fresh, partial, stale, unsupported]}
        evidences:
          type: array
          items: {$ref: '#/components/schemas/Evidence'}
        findings:
          type: array
          items: {$ref: '#/components/schemas/Finding'}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        reproducible:
          type: [boolean, 'null']
          description: Reavaliar as entradas GRAVADAS de cada regra, na mesma versão, dá os mesmos achados (nulo se uma versão deixou de existir, o que não deve ocorrer)
        rule_runs:
          type: array
          description: Regras avaliadas pelo job (id e versão); as entradas ficam gravadas no servidor para o replay
          items:
            type: object
            additionalProperties: false
            required: [rule_id, rule_version]
            properties:
              rule_id: {type: string, pattern: '^R-D[0-9]{3}$'}
              rule_version: {type: integer, minimum: 1}
    ActiveTestRequest:
      type: object
      additionalProperties: false
      required: [test_kind, origin, server_profile_id, max_bytes, max_duration_seconds, consent_id]
      properties:
        test_kind: {type: string, enum: [download, upload, ping, traceroute, ip_capacity]}
        origin: {type: string, enum: [cpe, edge, customer_endpoint]}
        server_profile_id: {$ref: '#/components/schemas/OpaqueRef'}
        max_bytes: {type: integer, minimum: 1, maximum: 1073741824}
        max_duration_seconds: {type: integer, minimum: 1, maximum: 120}
        consent_id: {$ref: '#/components/schemas/OpaqueRef'}
    ActionProposal:
      type: object
      additionalProperties: false
      required: [proposal_id, cpe_id, action_kind, risk, proposal_hash, expires_at, status]
      properties:
        proposal_id: {type: string, format: uuid}
        cpe_id: {type: string, format: uuid}
        action_kind: {type: string, enum: [wifi_channel_change, wifi_band_steering, wan_reconnect, cpe_reboot, plan_profile_align]}
        parameters:
          type: object
          description: Somente argumentos tipados e validados criados pelo servidor, estritos por action_kind
        risk: {type: string, enum: [R1, R2, R3]}
        proposal_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        expires_at: {type: string, format: date-time}
        status: {type: string, enum: [proposed, pending_approval, approved, rejected, expired, blocked, executed]}
      allOf:
        - if: {properties: {action_kind: {const: wifi_channel_change}}, required: [action_kind]}
          then:
            required: [parameters]
            properties:
              parameters:
                type: object
                additionalProperties: false
                required: [band, channel]
                properties:
                  band: {type: string, enum: [2.4GHz, 5GHz]}
                  channel: {type: integer, minimum: 1, maximum: 196}
        - if: {properties: {action_kind: {const: wifi_band_steering}}, required: [action_kind]}
          then:
            required: [parameters]
            properties:
              parameters:
                type: object
                additionalProperties: false
                required: [enabled]
                properties:
                  enabled: {type: boolean}
        - if: {properties: {action_kind: {const: plan_profile_align}}, required: [action_kind]}
          then:
            required: [parameters]
            properties:
              parameters:
                type: object
                additionalProperties: false
                required: [profile_id]
                properties:
                  profile_id: {type: string, format: uuid}
        - if: {properties: {action_kind: {enum: [wan_reconnect, cpe_reboot]}}, required: [action_kind]}
          then:
            properties:
              parameters: {type: object, additionalProperties: false, maxProperties: 0}
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [proposal_hash, decision, reason_code]
      properties:
        proposal_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        decision: {type: string, enum: [approve, reject]}
        reason_code:
          description: >-
            Motivo da decisão como CÓDIGO de lista fechada. Não há campo de texto livre no pedido de aprovação: um padrão de texto não prova
            ausência de segredo, então o contrato simplesmente não oferece onde escrevê-lo. Observação humana, se vier a existir, será outro
            recurso com redação própria.
          type: string
          enum: [evidence_reviewed, within_maintenance_window, customer_consented, risk_accepted, rejected_insufficient_evidence, rejected_risk_too_high, rejected_outside_window, rejected_other]
    ApprovalReceipt:
      type: object
      required: [approval_id, status, proposal_id, approved_at, expires_at]
      properties:
        approval_id: {type: string, format: uuid}
        status: {type: string, enum: [approved, rejected, blocked]}
        proposal_id: {type: string, format: uuid}
        approved_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    ExecutionIntent:
      type: object
      additionalProperties: false
      required: [approval_id, proposal_hash]
      properties:
        approval_id: {type: string, format: uuid}
        proposal_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
    ExecutionReceipt:
      type: object
      required: [execution_id, state, created_at]
      properties:
        execution_id: {type: string, format: uuid}
        state: {type: string, enum: [pending_preflight, blocked]}
        created_at: {type: string, format: date-time}

openapi: 3.1.0
info:
  title: FiberCore AI Public/Operator API
  version: 0.7.0-draft
  description: >-
    Contrato evolutivo orientado a multi-tenancy; implementação segura é obrigatória
    antes de tráfego real. Tenant é derivado de claims autenticadas e validação de memberships.
servers:
  - url: /api/v1
tags:
  - name: Platform
  - name: Network
  - name: CPE
  - name: ERP
  - name: Jobs
  - name: Copilot
  - name: Edge
  - name: NOC
  - name: Inventory
  - name: Diagnostics
security:
  - bearerAuth: []
paths:
  /platform/modules:
    get:
      tags: [Platform]
      operationId: listModuleHealth
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}]
      summary: Consultar saúde dos módulos, dependências e capacidades
      responses:
        '200':
          description: Lista módulos
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ModuleHealth'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /platform/versions:
    get:
      tags: [Platform]
      operationId: listVersionInventory
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}]
      responses:
        '200':
          description: Versões da plataforma, Edge e adapters
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/VersionInfo'}}}}
  /auth/token:
    post:
      tags: [Platform]
      operationId: loginUser
      summary: Troca e-mail+senha por access token curto (HS256, Sprint 0; OIDC planejado, ver ADR-0004)
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}
      responses:
        '200': {description: "Sessão (access + refresh) ou, se a conta tem MFA, desafio mfa_required/mfa_token a concluir em /auth/mfa/verify", content: {application/json: {schema: {$ref: '#/components/schemas/LoginResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {description: Bloqueio temporário por tentativas falhas}
  /auth/refresh:
    post:
      tags: [Platform]
      operationId: refreshSession
      summary: Rotaciona o refresh token (uso único). Reapresentar um token já consumido revoga a família inteira.
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}
      responses:
        '200': {description: Novo par access+refresh, content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      tags: [Platform]
      operationId: logoutSession
      summary: Revoga a família do refresh token (idempotente)
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}
      responses:
        '204': {description: Revogado}
  /auth/mfa/verify:
    post:
      tags: [Platform]
      operationId: verifyMfa
      summary: Segundo fator do login (TOTP com proteção contra replay, ou código de recuperação de uso único)
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [mfa_token, code], properties: {mfa_token: {type: string}, code: {type: string, minLength: 6, maxLength: 32}}}}}
      responses:
        '200': {description: Sessão, content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {description: Bloqueio temporário por tentativas falhas}
  /auth/mfa/status:
    get:
      tags: [Platform]
      operationId: mfaStatus
      summary: Estado do MFA do usuário autenticado
      responses:
        '200': {description: "{enabled, recovery_codes_left, enrolment_available, required} - required=true quando um papel do usuário consta em MFA_REQUIRED_ROLES"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/mfa/enroll:
    post:
      tags: [Platform]
      operationId: enrollMfa
      summary: Inicia o cadastro de TOTP (exige a senha atual). 503 se MFA_ENCRYPTION_KEY não estiver configurada.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [password], properties: {password: {type: string}}}}}
      responses:
        '200': {description: "{secret, otpauth_uri}"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {description: MFA não configurado}
  /auth/mfa/activate:
    post:
      tags: [Platform]
      operationId: activateMfa
      summary: Confirma o TOTP e devolve, uma única vez, os códigos de recuperação
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string}}}}}
      responses:
        '200': {description: "{enabled, recovery_codes[]}"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: MFA já ativo (ativações concorrentes são serializadas; só a primeira recebe os códigos)}
        '429': {description: Bloqueio temporário por tentativas falhas}
  /auth/mfa/recovery-codes:
    post:
      tags: [Platform]
      operationId: regenerateRecoveryCodes
      summary: Substitui TODOS os códigos de recuperação por um conjunto novo, exibido uma única vez. Exige a senha e um segundo fator (código do autenticador ou de recuperação); os antigos deixam de valer na mesma transação
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password, code], properties: {password: {type: string}, code: {type: string}}}}}}
      responses:
        '200':
          description: "{recovery_codes[]}"
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: MFA não está ativo}
        '429': {description: Bloqueio temporário por tentativas falhas}
  /auth/mfa/disable:
    post:
      tags: [Platform]
      operationId: disableMfa
      summary: Desativa o MFA (exige senha atual e um segundo fator válido). 409 se o MFA é obrigatório para algum papel do usuário (MFA_REQUIRED_ROLES).
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [password, code], properties: {password: {type: string}, code: {type: string}}}}}
      responses:
        '204': {description: Desativado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {description: Bloqueio temporário por tentativas falhas}
  /auth/service-token:
    post:
      tags: [Platform]
      operationId: loginServiceAccount
      summary: Token de service account, fixo no tenant da conta
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ServiceLoginRequest'}}}
      responses:
        '200': {description: Token emitido, content: {application/json: {schema: {$ref: '#/components/schemas/TokenResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/workspaces:
    get:
      tags: [Platform]
      operationId: listMyWorkspaces
      summary: Workspaces (tenants) do USUÁRIO autenticado; não exige seleção de tenant. Token revogado/conta inativa = 401
      responses:
        '200': {description: "[{tenant_id, name, role}]"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Token de serviço não se aplica}
  /auth/me:
    get:
      tags: [Platform]
      operationId: whoAmI
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}]
      responses:
        '200': {description: Principal resolvido por membership, content: {application/json: {schema: {$ref: '#/components/schemas/Principal'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Workspace inexistente ou sem membership (indistinguíveis)}
  /tenant:
    get:
      tags: [Platform]
      operationId: getCurrentTenant
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}]
      responses:
        '200': {description: Tenant atual (RLS), content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /tenant/features:
    get:
      tags: [Platform]
      operationId: listTenantFeatures
      summary: Flags de funcionalidade deste provedor (padrão do código, com override por tenant feito pelo dono via CLI). source = default | tenant
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}]
      responses:
        '200': {description: "[{feature, enabled, source}]"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /audit:
    get:
      tags: [Platform]
      operationId: listAudit
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Auditoria do tenant, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /erp/import-csv:
    post:
      tags: [ERP]
      operationId: importCustomersCsv
      description: >-
        CSV UTF-8 (<=2 MiB, <=5000 linhas). Colunas obrigatórias erp_customer_id,display_name; opcionais document,contract_status,
        onu_serial,source_updated_at. Documento nunca é armazenado em claro (HMAC por tenant + last4). Erros por linha não ecoam valores.
        Serial exato de ONU gera SUGESTÃO de associação (score 95; 50 se ambígua/conflitante); nada é aprovado automaticamente.
      parameters:
        - {$ref: '#/components/parameters/WorkspaceOptional'}
        - {name: source, in: query, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{1,39}$'}}
      requestBody: {required: true, content: {text/csv: {schema: {type: string}}}}
      responses:
        '200': {description: "Relatório da importação: accepted, rejected, suggestions, conflicts, unmatched_rows"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {description: Arquivo ou nº de linhas acima do limite}
        '422': {description: Colunas/encoding/source inválidos}
        '503': {description: Chave de proteção de PII não configurada (fail closed)}
  /customers:
    get:
      tags: [ERP]
      operationId: listCustomers
      description: Acesso a dados pessoais é registrado em auditoria (evidência = limit, offset e se houve filtro; o texto buscado não é gravado). `q` é substring do nome sem diferenciar maiúsculas; %, _ e \ são literais.
      parameters:
        - {$ref: '#/components/parameters/WorkspaceOptional'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
        - {name: q, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        '200': {description: Clientes (sem documento completo), content: {application/json: {schema: {type: array, items: {type: object}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /associations:
    get:
      tags: [ERP]
      operationId: listAssociations
      parameters:
        - {$ref: '#/components/parameters/WorkspaceOptional'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [suggested, approved, rejected]}}
      responses:
        '200': {description: Associações ONU<->cliente com evidência, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /associations/{assocId}/approve:
    post:
      tags: [ERP]
      operationId: approveAssociation
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {name: assocId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: "Aprovada: auditada e evento association.approved"}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Não encontrada neste tenant}
        '409': {description: "Já revisada, serial ambíguo ou ONU já com associação aprovada"}
  /associations/{assocId}/reject:
    post:
      tags: [ERP]
      operationId: rejectAssociation
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {name: assocId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Rejeitada}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Não encontrada neste tenant}
        '409': {description: Já revisada}
  /incidents:
    get:
      tags: [NOC]
      operationId: listIncidents
      description: >-
        Incidentes de queda em massa por PON (>=5 ONUs observadas no snapshot e >=80% fora; resolve <50%, com histerese) e alertas
        computados. Silêncio de Edge não abre nem fecha incidentes: marca `edge_silent` e lista o alerta; estados são "último conhecido".
        Cada incidente traz `impact` {customers_affected, source: associations_approved, hidden, members_known}: clientes DISTINTOS ligados às ONUs
        do incidente por associações APROVADAS (sem `customers:read` = `hidden`, nunca 0; incidente sem membros = desconhecido, nunca 0).
        `summary` (sobre TODOS os abertos): open, unacknowledged, silent_edges, open_suppressed e customers_affected (não inclui incidentes
        atrás de Edge silencioso). `order=priority`: abertos; não reconhecidos; queda confirmada antes de edge_silent; maior impacto (desconhecido
        por último); mais ONUs fora; mais recente. A prioridade vale ANTES do `limit` (varre todos os abertos, teto 1000; `truncated`=true se o teto agir). Padrão `recent` (mais recente primeiro) inalterado (FC22-009).
      parameters:
        - {$ref: '#/components/parameters/WorkspaceOptional'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: status, in: query, required: false, schema: {type: string, enum: [open, resolved]}}
        - {name: order, in: query, required: false, schema: {type: string, enum: [recent, priority], default: recent}}
      responses:
        '200': {description: "Objeto com incidents, alerts e summary", content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /incidents/{incidentId}:
    get:
      tags: [NOC]
      operationId: getIncident
      summary: Um incidente para o painel lateral (FC22-009) - evidências, impacto com fonte e as ONUs-membro (até 50, `members_truncated`); só inventário, nunca nomes de clientes
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {name: incidentId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Incidente, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Não encontrado neste tenant}
  /incidents/{incidentId}/ack:
    post:
      tags: [NOC]
      operationId: ackIncident
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {name: incidentId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Reconhecido e auditado}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Não encontrado neste tenant}
        '409': {description: Já reconhecido}
  /olts:
    get:
      tags: [Network]
      operationId: listOlts
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Inventário OLT
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Olt'}}}}
  /onus:
    get:
      tags: [Network]
      operationId: listOnus
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {$ref: '#/components/parameters/Limit'}, {name: serial, in: query, required: false, schema: {type: string}}, {name: olt_id, in: query, required: false, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: Inventário ONU
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Onu'}}}}
  /onus/offline:
    get:
      tags: [Network]
      operationId: listOfflineOnus
      summary: ONUs offline há pelo menos `min_hours`, as mais antigas primeiro (agendar retirada, contatar o cliente). O início da queda traz a BASE (`transition_observed` = visto online e depois fora, exato; `olt_reported` = o \"Last down time\" que a própria OLT informa para a ONU (o relógio da OLT pode divergir alguns minutos); `since_last_online` = visto online pela última vez nesse instante, a queda dura NO MÁXIMO isso). ONU nunca vista online não tem início conhecido e só é contada em `excluded.unknown_start`; linhas com ONU OU snapshot da OLT velhos (>15 min) ficam fora (`excluded.stale`, decidido antes do `limit`) salvo `include_stale=true`. `format=csv` devolve o mesmo conteúdo em CSV (cabeçalhos X-Excluded-*). inventory:read
      parameters:
        - $ref: '#/components/parameters/WorkspaceOptional'
        - {name: min_hours, in: query, required: false, schema: {type: number, minimum: 0, maximum: 8760, default: 24}}
        - {name: olt_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: pon_path, in: query, required: false, schema: {type: string, pattern: '^[0-9/]{1,32}$'}}
        - {name: include_stale, in: query, required: false, schema: {type: boolean, default: false}}
        - {name: format, in: query, required: false, schema: {type: string, enum: [json, csv], default: json}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 5000, default: 500}}
      responses:
        '200':
          description: ONUs offline; JSON (OfflineOnuReport) ou text/csv (mesmas colunas dos itens; cabeçalhos X-Excluded-Stale, X-Excluded-Unknown-Start, X-Truncated)
          content:
            application/json: {schema: {$ref: '#/components/schemas/OfflineOnuReport'}}
            text/csv: {schema: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /onus/{onu_id}:
    get:
      tags: [Network]
      operationId: getOnu360
      summary: ONU 360 — estado, OLT/PON e incidente aberto (incidents:read; sem a permissão, incident_hidden=true). Cada bloco externo traz provenance{source, observed_at, quality fresh|stale|unknown}. Nunca traz dados pessoais
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {name: onu_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: "{id, serial, status, rx_dbm, freshness, last_online_at, down_since, olt{}, pon{path,onus,online}, incident{}|null, incident_hidden, provenance{state,olt,pon?}, source}"
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: ONU inexistente ou de outro provedor}
  /onus/{onu_id}/customer:
    get:
      tags: [Network]
      operationId: getOnuCustomer
      summary: Assinante vinculado à ONU (dado pessoal) — exige customers:read e toda visualização é auditada
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {name: onu_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: "{association: approved|suggested|none, pending_suggestions, display_name?, document_last4?, contract_status?}"
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: ONU inexistente ou de outro provedor}
  /members:
    get:
      tags: [Platform]
      operationId: listMembers
      summary: Membros do workspace (members:read) com o estado do MFA de cada um; can_reset_mfa indica se o chamador pode redefinir
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}]
      responses:
        '200':
          description: "{can_reset_mfa, members[{user_id, email, display_name, role, mfa_enabled, is_self}]}"
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /roles:
    get:
      tags: [Platform]
      operationId: listRoles
      summary: Papéis do sistema (ADR-0031) com as permissões de cada um, vindas do catálogo, e quais o chamador pode atribuir (roles:read)
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}]
      responses:
        '200':
          description: "{roles[{role, label, assignable_by_me, permissions[{name, risk R0..R3, description}]}]}"
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /members/{user_id}/role:
    put:
      tags: [Platform]
      operationId: changeMemberRole
      summary: Altera o papel de sistema de um membro (members:manage). Recusas com código estável (403 cannot_change_own_role | role_cannot_grant | role_not_assignable | target_role_protected; 409 role_unchanged | last_isp_admin). Uma trava por provedor; o último isp_admin ativo não sai; as sessões do membro terminam; toda mudança é auditada com o motivo. As sessões são da CONTA, então a mudança desloga o membro de todos os provedores a que pertence. A escrita no banco só passa pela função app_change_member_role (o papel de execução não tem UPDATE na coluna)
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [role, reason], properties: {role: {type: string}, reason: {type: string, minLength: 3, maxLength: 200}}}}}}
      responses:
        '200':
          description: "{user_id, role, previous_role, revoked_sessions}"
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Membro inexistente neste provedor}
        '409': {description: Papel igual ao atual ou último isp_admin}
        '422': {description: Papel desconhecido ou motivo ausente}
  /members/{user_id}/mfa/reset:
    post:
      tags: [Platform]
      operationId: resetMemberMfa
      summary: Redefine o MFA de outro membro (members:mfa_reset). Exige a senha E o segundo fator do próprio administrador (que precisa ter MFA ativo); apaga MFA e códigos do alvo, revoga as sessões dele e audita
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password, code], properties: {password: {type: string}, code: {type: string, description: TOTP ou código de recuperação do ADMINISTRADOR}}}}}}
      responses:
        '200':
          description: "{status: reset, revoked_sessions}"
        '401': {description: Senha ou código do administrador inválidos}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Pessoa não pertence a este workspace}
        '409': {description: "A si mesmo; conta que também pertence a outros workspaces (MFA é da conta); ou administrador sem MFA ativo"}
        '429': {description: Bloqueio temporário por tentativas falhas}
  /cpes:
    get:
      tags: [CPE]
      operationId: listCpes
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Inventário CPE com fontes CWMP/USP
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Cpe'}}}}
  /cpes/{cpe_id}:
    get:
      tags: [CPE]
      operationId: getCpe
      summary: Um CPE pelo id (a lista é limitada; o detalhe não depende dela). CPE de outro provedor = 404
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {name: cpe_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: O CPE com suas ligações de protocolo
          content: {application/json: {schema: {$ref: '#/components/schemas/Cpe'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: CPE inexistente ou de outro provedor}
  /onu-cpe-links/suggest:
    post:
      tags: [Inventory]
      operationId: suggestOnuCpeLinks
      summary: Cria SUGESTÕES ONU↔CPE onde o serial da ONU = serial canônico do CPE (regra serial_equal, confiança 0.50; 0.20 se o serial existe em mais de uma OLT). Idempotente; nunca confirma. Exige associations:review e a flag onu_cpe_links (ADR-0021)
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      responses:
        '201': {description: "{created, examined, limit_reached} (teto de 1000 pares por chamada)"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /onu-cpe-links:
    get:
      tags: [Inventory]
      operationId: listOnuCpeLinks
      summary: Vínculos ONU↔CPE (suggested|confirmed|rejected) com confiança e evidência. inventory:read + flag onu_cpe_links
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - {name: status, in: query, schema: {type: string, enum: [suggested, confirmed, rejected]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200': {description: Lista de vínculos, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /onu-cpe-links/{link_id}/confirm:
    post:
      tags: [Inventory]
      operationId: confirmOnuCpeLink
      summary: Uma pessoa confirma a sugestão (auditado + evento onu_cpe_link.confirmed). 409 se já revisada, ambígua, ou se a ONU/CPE já tem vínculo confirmado
      parameters: [{$ref: '#/components/parameters/TenantId'}, {name: link_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: "{id, status}"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Vínculo inexistente ou de outro provedor}
        '409': {description: Conflito}
  /onu-cpe-links/{link_id}/reject:
    post:
      tags: [Inventory]
      operationId: rejectOnuCpeLink
      summary: Uma pessoa rejeita a sugestão (auditado + evento onu_cpe_link.rejected); a regra não volta a sugerir o mesmo par
      parameters: [{$ref: '#/components/parameters/TenantId'}, {name: link_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: "{id, status}"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Vínculo inexistente ou de outro provedor}
        '409': {description: Já revisado}
  /customers/{customer_id}/context:
    get:
      tags: [ERP]
      operationId: getCustomerContext
      summary: Visão read-only de UM cliente (contrato + ONUs de associação APROVADA + CPE só com vínculo CONFIRMADO), cada bloco com fonte/data/qualidade. customers:read, auditado (customer.context.view), flag customer_context. status = unknown > stale > partial > complete; no máximo 50 ONUs por resposta (`onus_truncated`=true ⇒ nunca `complete`). Incidente só com incidents:read (senão incident_hidden). Nunca expõe HMAC do documento, ids do ERP nem segredos do CPE
      parameters: [{$ref: '#/components/parameters/TenantId'}, {name: customer_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: CustomerContext, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Cliente inexistente ou de outro provedor}
  /diagnostics/rules:
    get:
      tags: [Diagnostics]
      operationId: listDiagnosticRules
      summary: Regras determinísticas registradas (id, versão, título, descrição). Versões antigas permanecem; mudança de comportamento é versão nova. incidents:read + flag diagnostic_engine (FC22-006)
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      responses:
        '200': {description: "[{id, version, title, description, subject, read_only}]"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /diagnostics/runs:
    post:
      tags: [Diagnostics]
      operationId: createDiagnosticRun
      summary: Executa uma regra SOMENTE-LEITURA sobre o estado já coletado (sem tocar em equipamento, sem abrir incidente) e persiste a execução (regra+versão, entradas exatas, achados). Achados `observed|inferred|unknown`; `inferred` exige confirmação humana; dado velho = `unknown`. diagnostics:run + flag diagnostic_engine; até 200 PONs por execução (`truncated`)
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [rule_id], properties: {rule_id: {type: string, pattern: '^R-D[0-9]{3}$'}, rule_version: {type: integer, minimum: 1}, olt_id: {type: string, format: uuid}, pon_id: {type: string, format: uuid}, onu_id: {type: string, format: uuid, description: 'PON desta ONU (resolvida no servidor); exclusivo com olt_id e pon_id. Em regras de CPE (R-D002): o CPE ligado a esta ONU por vínculo CONFIRMADO'}, cpe_id: {type: string, format: uuid, description: 'Regras de CPE (R-D002): o CPE; exclusivo com olt_id, pon_id e onu_id. Regras de PON não aceitam cpe_id'}}}
      responses:
        '201': {description: "{run_id, rule_id, rule_version, scope, truncated, findings[{finding_id, status, hypothesis, evidence, evidence_refs, requires_human_confirmation, next_read_action}]}"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Regra ou versão inexistente}
        '422': {description: Corpo inválido}
  /diagnostics/runs/{run_id}:
    get:
      tags: [Diagnostics]
      operationId: getDiagnosticRun
      summary: Execução gravada + `reproducible` (reavaliar as ENTRADAS gravadas com a MESMA versão da regra dá os mesmos achados). incidents:read + flag diagnostic_engine
      parameters: [{$ref: '#/components/parameters/TenantId'}, {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Execução}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Execução inexistente ou de outro provedor}
  /cpes/{cpeId}/capabilities:
    get:
      tags: [CPE]
      operationId: getCpeCapabilities
      summary: Capacidades do CPE pelo perfil vendor/model/firmware (Capability Registry, ADR-0019). Sem registro, ou perfil/firmware incompleto = unknown/identified. Nunca libera escrita (blocked_reason vem do motor de jobs)
      parameters: [{$ref: '#/components/parameters/TenantId'}, {name: cpeId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: Capacidades por protocolo/firmware e homologação (uma por operação do catálogo × protocolo)
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Capability'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: CPE inexistente ou de outro provedor}
  /cpes/{cpeId}/state:
    get:
      tags: [CPE]
      operationId: getCpeState
      summary: Últimas observações de estado do CPE (cache do ACS) com idade e proveniência; `fresh` é só dica de exibição, cada regra decide a validade
      parameters: [{$ref: '#/components/parameters/TenantId'}, {name: cpeId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Estado observado, content: {application/json: {schema: {$ref: '#/components/schemas/CpeState'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: CPE inexistente ou de outro provedor}
  /olts/{oltId}/capabilities:
    get:
      tags: [Network]
      operationId: getOltCapabilities
      summary: Mesmo contrato para a OLT (a ONU usa o perfil da sua OLT)
      parameters: [{$ref: '#/components/parameters/TenantId'}, {name: oltId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: Capacidades da OLT
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Capability'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: OLT inexistente ou de outro provedor}
  /integrations/erp:
    get:
      tags: [ERP]
      operationId: listErpIntegrations
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      responses:
        '200':
          description: Integrações disponíveis
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ErpIntegration'}}}}
    post:
      tags: [ERP]
      operationId: createErpIntegration
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NewErpIntegration'}}}}
      responses:
        '201':
          description: Integração criada
          content: {application/json: {schema: {$ref: '#/components/schemas/ErpIntegration'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /integrations/erp/{erpId}/sync:
    post:
      tags: [ERP]
      operationId: startErpSync
      parameters: [{$ref: '#/components/parameters/TenantId'}, {name: erpId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202':
          description: Sync assíncrono iniciado (não concluído)
          content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}
  /jobs/preview:
    post:
      tags: [Jobs]
      operationId: previewJob
      description: >-
        Cria o job em PREVIEWED (idempotente por Idempotency-Key; mesma chave com intenção diferente => 409). Operações de escrita
        (reboot_cpe, set_wifi_ssid, provision_onu) retornam `blocked_reason=operation_not_homologated` e NÃO podem ser submetidas
        enquanto não houver homologação por firmware/modelo. `params` deve ser vazio nesta versão.
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JobIntent'}}}}
      responses:
        '201': {description: Job em PREVIEWED, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Alvo inexistente neste tenant}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: Operação desconhecida ou params não vazios}
  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Lista jobs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Job'}}}}}
  /jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Estado do job, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        '404': {description: Não encontrado neste tenant}
  /jobs/{jobId}/submit:
    post:
      tags: [Jobs]
      operationId: submitJob
      description: Somente o solicitante. R0 vai direto a APPROVED; R2/R3 vão a PENDING_APPROVAL. TTL de 15 min.
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Job submetido, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /jobs/{jobId}/approve:
    post:
      tags: [Jobs]
      operationId: approveJob
      description: Aprovador distinto do solicitante; R3 exige dois aprovadores distintos. Aprovação não executa nada.
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Aprovação registrada, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /jobs/{jobId}/cancel:
    post:
      tags: [Jobs]
      operationId: cancelJob
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}, {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Cancelado, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /edge/jobs/next:
    get:
      tags: [Edge]
      operationId: pullJob
      description: Edge (token ligado ao edge) puxa o próximo job APROVADO; resposta é o envelope assinado (Ed25519) de job-envelope.schema.json.
      responses:
        '200': {description: Envelope assinado}
        '204': {description: Nenhum job}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: Chave de assinatura não configurada (fail closed)}
  /edge/jobs/{jobId}/result:
    post:
      tags: [Edge]
      operationId: reportJobResult
      description: SUCCEEDED só com postcheck_ok=true; sem pós-check o estado é UNKNOWN.
      parameters: [{name: jobId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [state], properties: {state: {type: string, enum: [accepted, succeeded, failed]}, detail: {type: string, maxLength: 500}, postcheck_ok: {type: boolean}}}}}}
      responses:
        '204': {description: Registrado}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /copilot/suggestions:
    post:
      tags: [Copilot]
      operationId: requestSuggestion
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CopilotRequest'}}}}
      responses:
        '200':
          description: Sugestão e fontes, sem comandos de escrita
          content: {application/json: {schema: {$ref: '#/components/schemas/CopilotSuggestion'}}}
        '503': {description: Copiloto opcional indisponível; core permanece operacional}
  /edge/heartbeat:
    post:
      tags: [Edge]
      operationId: sendEdgeHeartbeat
      description: >-
        Alvo: identidade mTLS de agente (ADR-0011). Interino implementado: bearer de service account com papel
        `edge_agent` (token curto), tenant_id do corpo deve coincidir com o do token.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EdgeHeartbeat'}}}}
      responses:
        '204': {description: Heartbeat recebido com identidade de Edge validada}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Edge não registrado ou revogado}
  /edge/olt-snapshots:
    post:
      tags: [Edge]
      operationId: ingestOltSnapshot
      description: Edge->Cloud, token de service account `edge_agent` ligado a UM edge. Snapshots mais antigos que o dado atual são ignorados. Só leitura da rede.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OltSnapshot'}}}}
      responses:
        '202': {description: Aceito (status accepted ou ignored_stale)}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: Validação}
  /edge/cpe-snapshots:
    post:
      tags: [Edge]
      operationId: ingestCpeSnapshot
      summary: O serial é uma reivindicação do dispositivo; reivindicação com external_id diferente do já vinculado (ou conflitante no lote) é IGNORADA e contada em `conflicts`, nunca mesclada
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CpeSnapshot'}}}}
      responses:
        '202':
          description: "Processado. `conflicts` conta reivindicações ignoradas (nunca mescladas); `skipped` conta CPEs mais antigos que o já gravado."
          content: {application/json: {schema: {$ref: '#/components/schemas/CpeSnapshotAck'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: "Só quando o CPE já pertence a OUTRO edge (corrida entre edges). Reivindicação de identidade conflitante NÃO gera 409: é ignorada e contada em `conflicts`."}
        '422': {description: Validação}
  /edge/cpe-state:
    post:
      tags: [Edge]
      operationId: ingestCpeState
      summary: "Estado WAN/Wi-Fi do CPE lido do cache do ACS pelo Edge (SD-001, ADR-SD-002). Lista FECHADA de métricas com valores tipados; o Edge só escreve nos CPEs do próprio edge (binding desconhecido ou de outro edge conta em `unknown`, sem distinguir). Vence apenas `captured_at` estritamente mais novo."
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CpeStateSnapshot'}}}}
      responses:
        '202':
          description: Aceito. `unknown` conta CPEs não vinculados a este edge
          content: {application/json: {schema: {$ref: '#/components/schemas/CpeStateAck'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: "Validação (métrica fora da lista, valor/escopo inválido, campo extra, relógio do dispositivo no futuro)"}
  /diagnostics/jobs:
    post:
      operationId: createDiagnosticJob
      tags:
      - Diagnostics
      summary: 'Job de diagnóstico PASSIVO (ADR-0028): lê só o dado já retido, avalia R-D001/R-D002, grava evidências, entradas das regras e achados. diagnostics:run + flags smart_diagnostics_jobs e diagnostic_engine (desligadas por padrão)'
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: Idempotency-Key
        in: header
        required: true
        description: Valor opaco, por exemplo um UUID; sem dois-pontos para não aceitar MAC. A mesma chave com o mesmo pedido devolve o mesmo job.
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_.-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiagnosticJob'
      responses:
        '202':
          description: Aceito e concluído dentro do pedido (o job passivo só lê dado retido); `status` é o real (complete/partial/inconclusive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticJobReceipt'
        '400':
          description: Corpo inválido
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão ou flag desligada
        '409':
          description: Mesma Idempotency-Key com intenção diferente
        '429':
          description: Orçamento/quota excedido
        '422':
          description: Corpo inválido (mode diferente de passive, domínio sem fonte de dado, campo extra, cpe_id não ligado a uma ONU aprovada do cliente)
        '404':
          description: Cliente inexistente ou de outro provedor
  /diagnostics/jobs/{job_id}:
    get:
      operationId: getDiagnosticJob
      tags:
      - Diagnostics
      summary: Estado do job e referências de evidência. incidents:read + flag smart_diagnostics_jobs
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Retrato do job (tenant vem do servidor, nunca do corpo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticJob'
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão ou flag desligada
        '404':
          description: Job inexistente ou de outro tenant
  /edges:
    get:
      tags: [Edge]
      operationId: listEdges
      parameters: [{$ref: '#/components/parameters/WorkspaceOptional'}]
      responses:
        '200': {description: Edges do tenant com status calculado (online/offline/unknown/revoked), content: {application/json: {schema: {type: array, items: {type: object}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    TenantId:
      name: X-Workspace-ID
      in: header
      required: true
      description: >-
        Contexto pedido pelo usuário; deve ser comparado à membership validada do token no servidor.
      schema: {type: string, format: uuid}
    WorkspaceOptional:
      name: X-Workspace-ID
      in: header
      required: false
      description: Obrigatório só se o usuário tiver mais de uma membership (400 caso contrário). Ignorado para service accounts.
      schema: {type: string, format: uuid}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
  responses:
    Unauthorized: {description: Autenticação exigida}
    Forbidden: {description: "Usuário sem permissão sobre tenant ou capacidade; detail=mfa_enrolment_required quando o papel exige MFA e o usuário ainda não o ativou (MFA_REQUIRED_ROLES)"}
    Conflict: {description: Operação concorrente ou estado incompatível}
  schemas:
    CpeSnapshotAck:
      type: object
      required: [status, cpes, skipped, conflicts]
      properties:
        status: {type: string, enum: [accepted, ignored_stale]}
        cpes: {type: integer, minimum: 0, description: CPEs gravados neste snapshot}
        skipped: {type: integer, minimum: 0, description: CPEs ignorados por terem observação mais antiga que a já gravada}
        conflicts: {type: integer, minimum: 0, description: Reivindicações de identidade ignoradas (external_id diferente do vinculado, serial/binding disputado no lote ou já ligado a outro serial)}
    CpeStateSnapshot:
      type: object
      additionalProperties: false
      required: [edge_id, observed_at, states]
      properties:
        edge_id: {type: string, format: uuid}
        observed_at: {type: string, format: date-time}
        states:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [binding, metrics]
            properties:
              binding:
                type: object
                additionalProperties: false
                required: [protocol, external_id, connector_id]
                properties:
                  protocol: {type: string, enum: [tr069, tr369]}
                  external_id: {type: string, minLength: 1, maxLength: 128}
                  connector_id: {type: string, minLength: 1, maxLength: 128}
              metrics:
                type: array
                minItems: 1
                maxItems: 64
                items:
                  type: object
                  additionalProperties: false
                  required: [name, scope, value, captured_at]
                  properties:
                    name: {type: string, enum: [wan_link_status, wan_connection_status, uptime_seconds, wifi_radio_enabled, wifi_channel]}
                    scope: {type: string, maxLength: 32, pattern: '^(link/[0-9]{1,3}|(ppp|ip)(/[0-9]{1,3}){1,2}|device/0|radio/[0-9]{1,3})$', description: 'Fechado POR métrica: link/N (wan_link_status); ppp|ip/N[/N] (wan_connection_status, uptime_seconds); device/0 (uptime_seconds); radio/N (wifi_radio_enabled, wifi_channel)'}
                    value: {description: "Tipado por métrica: palavra de estado de um enum fixo (inclui Enabled/Disabled do rádio) ou inteiro em faixa", oneOf: [{type: string}, {type: integer}]}
                    captured_at: {type: string, format: date-time, description: Horário do dispositivo guardado pelo ACS}
    CpeStateAck:
      type: object
      required: [status, cpes, metrics, unknown]
      properties:
        status: {type: string, enum: [accepted]}
        cpes: {type: integer, minimum: 0}
        metrics: {type: integer, minimum: 0, description: Observações enviadas ao upsert (as não mais novas que a gravada não alteram nada)}
        unknown: {type: integer, minimum: 0}
    CpeState:
      type: object
      required: [cpe_id, source, metrics]
      properties:
        cpe_id: {type: string, format: uuid}
        source: {type: string, enum: [acs_cache]}
        metrics:
          type: array
          items:
            type: object
            required: [metric, scope, value, captured_at, received_at, age_seconds, fresh]
            properties:
              metric: {type: string}
              scope: {type: string}
              value: {oneOf: [{type: string}, {type: integer}]}
              captured_at: {type: string, format: date-time}
              received_at: {type: string, format: date-time}
              age_seconds: {type: integer, minimum: 0}
              fresh: {type: boolean}
    CreateDiagnosticJob:
      type: object
      additionalProperties: false
      required:
      - customer_id
      - mode
      properties:
        customer_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        cpe_id:
          type: string
          format: uuid
        mode:
          type: string
          enum:
          - passive
          - guided
          description: 'ADR-0028: a implementação aceita só passive; guided fica para o PR que o implementa'
        requested_domains:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - pon
            - wan
            - wifi
            - lan
            - internet
            - erp
            - bng
        ticket_id:
          $ref: '#/components/schemas/OpaqueRef'
    DiagnosticJobReceipt:
      type: object
      required:
      - job_id
      - status
      - created_at
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
          - waiting_for_device
          - complete
          - partial
          - inconclusive
          - failed
          description: 'queued/running/waiting_for_device: execução assíncrona (ativa, futura). complete/partial/inconclusive/failed: o job passivo, que só lê dado já retido, termina dentro do pedido (ADR-0028)'
        created_at:
          type: string
          format: date-time
    DiagnosticJob:
      type: object
      required:
      - job_id
      - status
      - data_quality
      - evidences
      - findings
      - created_at
      properties:
        job_id:
          type: string
          format: uuid
        run_id:
          type:
          - string
          - 'null'
          format: uuid
          description: diagnostic_runs gerado ao concluir (ADR-0024); nulo enquanto não houver execução de regra
        status:
          type: string
          enum:
          - queued
          - running
          - partial
          - complete
          - failed
          - cancelled
          - inconclusive
        data_quality:
          type: string
          enum:
          - fresh
          - partial
          - stale
          - unsupported
        evidences:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        reproducible:
          type:
          - boolean
          - 'null'
          description: Reavaliar as entradas GRAVADAS de cada regra, na mesma versão, dá os mesmos achados (nulo se uma versão deixou de existir, o que não deve ocorrer)
        rule_runs:
          type: array
          description: Regras avaliadas pelo job (id e versão); as entradas ficam gravadas no servidor para o replay
          items:
            type: object
            additionalProperties: false
            required:
            - rule_id
            - rule_version
            properties:
              rule_id:
                type: string
                pattern: ^R-D[0-9]{3}$
              rule_version:
                type: integer
                minimum: 1
    Evidence:
      type: object
      additionalProperties: false
      required:
      - evidence_id
      - source_type
      - status
      - captured_at
      properties:
        evidence_id:
          $ref: '#/components/schemas/OpaqueRef'
        source_type:
          type: string
          enum:
          - olt
          - cpe_cwmp
          - cpe_usp
          - edge
          - endpoint
          - erp
          - bng
        status:
          type: string
          enum:
          - available
          - stale
          - unsupported
          - failed
          - inconclusive
        metric:
          $ref: '#/components/schemas/MetricName'
        value:
          description: Número ou estado da lista permitida; nunca texto livre (PSK, usuário PPPoE e MAC não passam por aqui)
          oneOf:
          - type: number
          - $ref: '#/components/schemas/StateValue'
          - type: 'null'
        unit:
          type: string
          enum:
          - ''
          - dBm
          - dB
          - Mbps
          - ms
          - percent
          - seconds
          - count
        capture_side:
          type: string
          enum:
          - onu_rx
          - olt_rx
          - cpe
          - wan
          - lan
          - wifi_2g
          - wifi_5g
        captured_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        method:
          type: string
          enum:
          - snmp
          - cli
          - genieacs_nbi
          - usp
          - vendor_driver
          - vendor_driver_mock
          - mock_genieacs
          - unsupported
        scope_ref:
          $ref: '#/components/schemas/OpaqueRef'
          description: Referência opaca do objeto medido (ONU ou PON), estável por tenant; sem serial nem caminho
        parent_ref:
          $ref: '#/components/schemas/OpaqueRef'
          description: Referência opaca do objeto que contém o medido (a PON de uma ONU)
        window_seconds:
          type: integer
          minimum: 1
          description: Janela de agregação usada na medida (contagens por PON)
        confidence:
          type: string
          enum:
          - verified
          - observed
          - unverified
    Finding:
      type: object
      additionalProperties: false
      required:
      - category
      - certainty
      - evidence_ids
      - explanation
      properties:
        category:
          $ref: '#/components/schemas/FindingCategory'
        certainty:
          type: string
          enum:
          - confirmed
          - likely
          - possible
          - insufficient_evidence
        evidence_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OpaqueRef'
        explanation:
          $ref: '#/components/schemas/SafeText'
      allOf:
      - if:
          properties:
            certainty:
              enum:
              - confirmed
              - likely
              - possible
        then:
          properties:
            evidence_ids:
              minItems: 1
    FindingCategory:
      type: string
      enum:
      - PON_OPTICAL
      - PON_MASS_OUTAGE
      - ONU_OFFLINE
      - WAN_LINK
      - WAN_AUTH
      - WIFI_SIGNAL
      - WIFI_INTERFERENCE
      - LAN_PORT
      - CPE_STALE_DATA
      - ERP_STATUS
      - INCONCLUSIVE
    MetricName:
      type: string
      enum:
      - rx_optical_power
      - tx_optical_power
      - onu_status
      - wan_link_status
      - wan_connection_status
      - wan_download
      - wan_upload
      - associated_client_rssi
      - wifi_channel
      - wifi_band
      - wifi_radio_enabled
      - lan_port_status
      - latency_rtt
      - packet_loss
      - uptime_seconds
      - pon_onus_online
      - pon_onus_recent_drops
    StateValue:
      type: string
      enum:
      - Up
      - Down
      - Connected
      - Connecting
      - Disconnected
      - Unconfigured
      - Enabled
      - Disabled
      - Error
      - Unknown
      - online
      - offline
      - los
      - dying_gasp
      - PendingDisconnect
      - Disconnecting
      - Initializing
      - Unavailable
      - Dormant
      - NotPresent
      - LowerLayerDown
    OpaqueRef:
      type: string
      pattern: ^(?![0-9A-Fa-f]{2}([-:.]?[0-9A-Fa-f]{2}){5}$)[A-Za-z0-9_-]{1,64}$
      description: Identificador opaco; rejeita o formato de MAC
    SafeText:
      type: string
      maxLength: 1000
      pattern: ^(?!.*(([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}|([Ss]enha|[Pp]assword|[Pp]asswd|PSK|psk|[Pp]assphrase|[Ss]ecret|[Tt]oken|[Cc]have|[Pp]ppoe|[Uu]su[aá]rio|[Uu]ser(name)?)\s*[:=]))[\s\S]*$
      description: 'Texto narrativo. Rejeita MAC e chave=valor de credencial, mas NÃO prova ausência de segredo: o controle real é a redação na origem e antes de persistir/exibir (ADR-SD-002/ADR-SD-006). Exibir como texto puro.'
    LoginRequest:
      type: object
      required: [email, password]
      properties: {email: {type: string, format: email}, password: {type: string, minLength: 1, maxLength: 256}}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties: {refresh_token: {type: string, minLength: 20, maxLength: 200}}
    SessionResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties: {access_token: {type: string}, refresh_token: {type: string}, token_type: {type: string, enum: [bearer]}, expires_in: {type: integer}}
    LoginResponse:
      type: object
      properties:
        access_token: {type: [string, 'null']}
        refresh_token: {type: [string, 'null']}
        token_type: {type: string, enum: [bearer]}
        expires_in: {type: [integer, 'null']}
        mfa_required: {type: boolean}
        mfa_token: {type: [string, 'null']}
    ServiceLoginRequest:
      type: object
      required: [client_id, client_secret]
      properties: {client_id: {type: string, format: uuid}, client_secret: {type: string, minLength: 1, maxLength: 256}}
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties: {access_token: {type: string}, token_type: {type: string, enum: [bearer]}, expires_in: {type: integer}}
    Principal:
      type: object
      required: [id, kind, tenant_id, role]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [user, service]}
        tenant_id: {type: string, format: uuid}
        role: {type: string}
    SourceMetadata:
      type: object
      additionalProperties: false
      required: [origin, observed_at, ingested_at, quality]
      properties:
        origin: {type: string, enum: [olt, genieacs, usp, erp, manual, simulator]}
        observed_at: {type: string, format: date-time}
        ingested_at: {type: string, format: date-time}
        quality: {type: string, enum: [fresh, stale, unknown, conflict]}
        confidence: {type: number, minimum: 0, maximum: 1}
    ModuleHealth:
      type: object
      additionalProperties: false
      required: [id, version, status, capabilities, checked_at]
      properties:
        id: {type: string}
        version: {type: string}
        status: {type: string, enum: [healthy, degraded, unhealthy, disabled, unknown, starting, maintenance]}
        capabilities: {type: array, items: {type: string}}
        checked_at: {type: string, format: date-time}
        reason: {type: [string, 'null']}
    VersionInfo:
      type: object
      required: [module, version]
      properties: {module: {type: string}, version: {type: string}, changelog_url: {type: string}, approved_for_tenant: {type: boolean}}
    Freshness: {type: string, enum: [fresh, stale, unknown], description: "Calculado na leitura (limite 15 min). Silêncio do Edge/OLT => stale, nunca offline fabricado."}
    OfflineOnuReport:
      type: object
      required: [generated_at, criteria, excluded, truncated, count, items]
      properties:
        generated_at: {type: string, format: date-time}
        criteria: {type: object, properties: {min_hours: {type: number}, olt_id: {type: [string, 'null'], format: uuid}, pon_path: {type: [string, 'null']}, include_stale: {type: boolean}}}
        excluded:
          type: object
          properties:
            stale: {type: integer, description: "ONU ou snapshot da OLT velhos (>15 min), deixados de fora salvo include_stale=true"}
            unknown_start: {type: integer, description: "Offline sem nenhum início conhecido (nunca vista online, sem transição, sem Last down time da OLT)"}
        truncated: {type: boolean}
        count: {type: integer}
        items:
          type: array
          items:
            type: object
            required: [onu_id, serial, olt, status, offline_since, offline_hours, basis, freshness]
            properties:
              onu_id: {type: string, format: uuid}
              serial: {type: string}
              olt: {type: string}
              pon_path: {type: [string, 'null']}
              status: {type: string, enum: [offline, los, dying_gasp]}
              offline_since: {type: string, format: date-time}
              offline_hours: {type: number}
              basis:
                type: string
                enum: [transition_observed, olt_reported, since_last_online]
                description: "transition_observed = o Edge viu online e depois fora (exato); olt_reported = o 'Last down time' que a própria OLT informa (relógio da OLT pode divergir alguns minutos); since_last_online = visto online pela última vez nesse instante (a queda dura NO MÁXIMO isso)"
              last_online_at: {type: [string, 'null'], format: date-time}
              observed_at: {type: [string, 'null'], format: date-time}
              olt_observed_at: {type: [string, 'null'], format: date-time}
              freshness: {$ref: '#/components/schemas/Freshness'}
    Olt:
      type: object
      required: [id, name, vendor, edge_id, support_level, onu_count, freshness]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        vendor: {type: string}
        model: {type: [string, 'null']}
        firmware: {type: [string, 'null']}
        edge_id: {type: string, format: uuid}
        support_level: {type: string, enum: [identified, observed, certified], description: "certified só por homologação no servidor"}
        onu_count: {type: integer}
        observed_at: {type: [string, 'null'], format: date-time}
        freshness: {$ref: '#/components/schemas/Freshness'}
    Onu:
      type: object
      required: [id, olt_id, serial, status, freshness]
      properties:
        id: {type: string, format: uuid}
        olt_id: {type: string, format: uuid}
        serial: {type: string}
        pon_path: {type: [string, 'null']}
        rx_dbm: {type: [number, 'null'], minimum: -50, maximum: 10}
        status: {type: string, enum: [online, offline, los, dying_gasp, unknown]}
        observed_at: {type: [string, 'null'], format: date-time}
        freshness: {$ref: '#/components/schemas/Freshness'}
    Cpe:
      type: object
      required: [id, canonical_serial, bindings, freshness]
      properties:
        id: {type: string, format: uuid}
        canonical_serial: {type: string}
        vendor: {type: [string, 'null']}
        model: {type: [string, 'null']}
        firmware: {type: [string, 'null']}
        bindings:
          type: array
          items:
            type: object
            required: [protocol, connector_id, external_id]
            properties:
              protocol: {type: string, enum: [tr069, tr369]}
              connector_id: {type: string}
              external_id: {type: string}
        observed_at: {type: [string, 'null'], format: date-time}
        freshness: {$ref: '#/components/schemas/Freshness'}
    OltSnapshot:
      type: object
      required: [edge_id, observed_at, name, vendor]
      properties:
        edge_id: {type: string, format: uuid}
        observed_at: {type: string, format: date-time, description: "Com timezone; no máximo 5 min no futuro"}
        name: {type: string, maxLength: 128}
        vendor: {type: string}
        model: {type: [string, 'null']}
        firmware: {type: [string, 'null']}
        driver_level: {type: string, enum: [identified, observed], default: identified}
        pons: {type: array, maxItems: 512, items: {type: object, required: [pon_path], properties: {pon_path: {type: string}, status: {type: string, enum: [up, down, unknown]}, complete: {type: boolean, default: false, description: "true só se o snapshot lista TODAS as ONUs da PON; apenas PONs completas entram na correlação de incidentes"}}}}
        onus: {type: array, maxItems: 20000, items: {type: object, required: [serial], properties: {serial: {type: string}, pon_path: {type: string}, status: {type: string, enum: [online, offline, los, dying_gasp, unknown]}, rx_dbm: {type: [number, 'null'], minimum: -50, maximum: 10}, last_down_at: {type: [string, 'null'], format: date-time, description: "\"Last down time\" que a própria OLT guarda da ONU (leitura SNMP, só para ONU fora do ar; com fuso). Guardado à parte de down_since."}}}}
    CpeSnapshot:
      type: object
      required: [edge_id, observed_at, cpes]
      properties:
        edge_id: {type: string, format: uuid}
        observed_at: {type: string, format: date-time}
        cpes: {type: array, maxItems: 20000, items: {type: object, required: [canonical_serial, binding], properties: {canonical_serial: {type: string}, vendor: {type: string}, model: {type: string}, firmware: {type: string}, binding: {type: object, required: [protocol, external_id, connector_id], properties: {protocol: {type: string, enum: [tr069, tr369]}, external_id: {type: string}, connector_id: {type: string}}}}}}
    Capability:
      type: object
      required: [name, status, protocol, certification]
      properties:
        name: {type: string}
        status: {type: string, enum: [supported, unsupported, unknown]}
        protocol: {type: string, enum: [tr069, tr369, olt]}
        certification: {type: string, enum: [identified, observed, certified]}
        model: {type: [string, 'null']}
        firmware: {type: [string, 'null']}
        vendor: {type: [string, 'null']}
        writes: {type: boolean, description: A operação altera o equipamento}
        blocked_reason: {type: [string, 'null'], description: Motivo do bloqueio pelo motor de jobs (operation_not_homologated); null = leitura}
        verified_at: {type: [string, 'null'], format: date-time}
        evidence_ref: {type: [string, 'null']}
    NewErpIntegration:
      type: object
      required: [provider, name, secret_ref]
      properties:
        provider: {type: string, enum: [csv, generic_rest, ixc, sgp, mk_solutions, hubsoft, voalle, radiusnet, topsapp]}
        name: {type: string}
        secret_ref: {type: string, description: Identifier of secret, not raw credentials}
    ErpIntegration:
      allOf:
        - {$ref: '#/components/schemas/NewErpIntegration'}
        - {type: object, required: [id, status], properties: {id: {type: string, format: uuid}, status: {type: string, enum: [healthy, degraded, disabled, unknown]}}}
    JobIntent:
      type: object
      required: [target_id, operation]
      additionalProperties: false
      properties:
        target_id: {type: string, format: uuid}
        operation: {type: string, enum: [collect, refresh, reboot_cpe, set_wifi_ssid, provision_onu]}
        params: {type: object, maxProperties: 0, description: "Vazio nesta versão: nada livre chega a um Edge"}
    JobPreview:
      type: object
      required: [risk, requires_approval, certified, redacted_diff]
      properties:
        risk: {type: string, enum: [R0, R1, R2, R3]}
        requires_approval: {type: boolean}
        certified: {type: boolean}
        redacted_diff: {type: object}
        warnings: {type: array, items: {type: string}}
    Job:
      type: object
      required: [id, operation, target_type, target_id, risk, status, required_approvals, created_at]
      properties:
        id: {type: string, format: uuid}
        operation: {type: string}
        target_type: {type: string, enum: [olt, cpe]}
        target_id: {type: string, format: uuid}
        risk: {type: string, enum: [R0, R1, R2, R3]}
        status: {type: string, enum: [PREVIEWED, PENDING_APPROVAL, APPROVED, DISPATCHED, ACCEPTED, DEVICE_PENDING, VERIFYING, SUCCEEDED, FAILED, EXPIRED, UNKNOWN, CANCELLED]}
        required_approvals: {type: integer, minimum: 0, maximum: 2}
        blocked_reason: {type: [string, 'null'], description: "operation_not_homologated para escrita sem homologação"}
        expires_at: {type: [string, 'null'], format: date-time}
        result: {type: [object, 'null']}
        created_at: {type: string, format: date-time}
    Approval:
      type: object
      required: [reason]
      properties: {reason: {type: string, minLength: 10}, approval_window: {type: [string, 'null']}}
    CopilotRequest:
      type: object
      required: [mode, subject_id]
      properties:
        mode: {type: string, enum: [noc, support, field, engineering]}
        subject_id: {type: string, format: uuid}
        question: {type: [string, 'null']}
    CopilotSuggestion:
      type: object
      required: [summary, evidence, confidence]
      properties:
        summary: {type: string}
        evidence: {type: array, items: {type: object, properties: {ref: {type: string}, observed_at: {type: string, format: date-time}}}}
        confidence: {type: string, enum: [high, medium, low, unknown]}
        proposed_job_intent: {type: [object, 'null']}
    EdgeHeartbeat:
      type: object
      required: [edge_id, tenant_id, version, sent_at]
      properties:
        edge_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        version: {type: string}
        sent_at: {type: string, format: date-time}

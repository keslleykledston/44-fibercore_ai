openapi: 3.1.0
info:
  title: FiberCore AI ONT Configuration Manager additive API
  version: 2.4.0-draft
  description: Draft routes to MERGE into existing contract, not a new core service
servers:
- url: /api/v1
security:
- bearerAuth: []
paths:
  /ont-config/onts/{ontId}/capabilities:
    get:
      operationId: listOntCapabilities
      tags:
      - ONT Configuration
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/OntID'
      responses:
        '403':
          description: Forbidden
        '404':
          description: Not found / undisclosed across tenants
        '409':
          description: Stale revision or conflicting operation
        '503':
          description: Connector unavailable
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Capability'
      summary: List semantic capabilities and certification
  /ont-config/onts/{ontId}/configuration:
    get:
      operationId: getOntConfig
      tags:
      - ONT Configuration
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/OntID'
      responses:
        '403':
          description: Forbidden
        '404':
          description: Not found / undisclosed across tenants
        '409':
          description: Stale revision or conflicting operation
        '503':
          description: Connector unavailable
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                required:
                - snapshot_revision
                - fields
                properties:
                  snapshot_revision:
                    type: string
                  fields:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConfigurationField'
      summary: Read sanitized normalized configuration (never secret values)
  /ont-config/onts/{ontId}/form-schema:
    get:
      operationId: getOntFormSchema
      tags:
      - ONT Configuration
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/OntID'
      responses:
        '403':
          description: Forbidden
        '404':
          description: Not found / undisclosed across tenants
        '409':
          description: Stale revision or conflicting operation
        '503':
          description: Connector unavailable
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                required:
                - form_revision
                - fields
                properties:
                  form_revision:
                    type: string
                  fields:
                    type: array
                    items:
                      $ref: '#/components/schemas/FormField'
      summary: Generate form fields from certified capabilities and actual instance
        binding
  /ont-config/onts/{ontId}/changes/preview:
    post:
      operationId: previewOntChange
      tags:
      - ONT Configuration
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/OntID'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '403':
          description: Forbidden
        '404':
          description: Not found / undisclosed across tenants
        '409':
          description: Stale revision or conflicting operation
        '503':
          description: Connector unavailable
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePreview'
      summary: Validate proposed changes, calculate risk, never write to equipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeIntent'
  /ont-config/onts/{ontId}/changes:
    post:
      operationId: submitOntChange
      tags:
      - ONT Configuration
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/OntID'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Idempotency'
      responses:
        '403':
          description: Forbidden
        '404':
          description: Not found / undisclosed across tenants
        '409':
          description: Stale revision or conflicting operation
        '503':
          description: Connector unavailable
        '202':
          description: Queued for approval/execution; not device success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeJob'
      summary: Submit approved-intent request via existing automation-jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitChange'
  /ont-config/onts/{ontId}/changes/{changeId}:
    get:
      operationId: getOntConfigChange
      tags:
      - ONT Configuration
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/OntID'
      - name: changeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '403':
          description: Forbidden
        '404':
          description: Not found / undisclosed across tenants
        '409':
          description: Stale revision or conflicting operation
        '503':
          description: Connector unavailable
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeJob'
      summary: Track job state and post-check evidence; reuse jobs source of truth
  /ont-config/health:
    get:
      operationId: getOntConfigHealth
      tags:
      - ONT Configuration
      summary: Authorized platform module health, not device health
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
                  last_checked:
                    type: string
                    format: date-time
components:
  schemas:
    Provenance:
      type: object
      required:
      - source
      - observed_at
      - quality
      properties:
        source:
          type: string
          enum:
          - genieacs
          - usp
          - olt
          - simulator
        observed_at:
          type: string
          format: date-time
        quality:
          type: string
          enum:
          - fresh
          - stale
          - unknown
          - conflict
        connector_id:
          type: string
    Capability:
      type: object
      required:
      - name
      - scope
      - protocol
      - support
      - certification
      - write_allowed
      properties:
        name:
          type: string
          example: wifi.ssid.write
        scope:
          type: string
          example: wifi
        protocol:
          type: string
          enum:
          - tr069
          - tr369
          - olt
        support:
          type: string
          enum:
          - supported
          - unknown
          - unsupported
        certification:
          type: string
          enum:
          - identified
          - observed_read
          - certified_write
        write_allowed:
          type: boolean
        instance_key:
          type: string
        constraints:
          type: object
          additionalProperties: true
        reason:
          type: string
        evidence_ref:
          type: string
        firmware:
          type: string
    ConfigurationField:
      type: object
      required:
      - field
      - editable
      - provenance
      properties:
        field:
          type: string
        instance_key:
          type: string
        value: {}
        unit:
          type:
          - string
          - 'null'
        editable:
          type: boolean
        secret:
          type: boolean
        provenance:
          $ref: '#/components/schemas/Provenance'
    FormField:
      type: object
      required:
      - field
      - label
      - input_type
      - editable
      properties:
        field:
          type: string
        label:
          type: string
        instance_key:
          type: string
        input_type:
          type: string
          enum:
          - text
          - select
          - boolean
          - secret
          - readonly
        editable:
          type: boolean
        min_length:
          type: integer
        max_length:
          type: integer
        allowed_values:
          type: array
          items: {}
        unit:
          type:
          - string
          - 'null'
        disabled_reason:
          type: string
        risk:
          type: string
          enum:
          - R0
          - R1
          - R2
          - R3
    FieldIntent:
      type: object
      additionalProperties: false
      required:
      - capability
      - instance_key
      properties:
        capability:
          type: string
          description: Canonical capability id, NOT TR-069 raw parameter path
        instance_key:
          type: string
        desired_value:
          type:
          - string
          - integer
          - number
          - boolean
          - 'null'
        secret_ref:
          type: string
          description: Secret-store reference for write-only values, no plaintext
    ChangeIntent:
      type: object
      additionalProperties: false
      required:
      - target_id
      - snapshot_revision
      - changes
      properties:
        target_id:
          type: string
          format: uuid
        snapshot_revision:
          type: string
        changes:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/FieldIntent'
        reason:
          type: string
        maintenance_window_id:
          type: string
          format: uuid
        recovery_plan_ref:
          type: string
    ChangePreview:
      type: object
      required:
      - preview_id
      - risk
      - allowed
      - requires_approval
      - expires_at
      - redacted_diff
      - intent_hash
      properties:
        preview_id:
          type: string
          format: uuid
        risk:
          type: string
          enum:
          - R0
          - R1
          - R2
          - R3
        allowed:
          type: boolean
        requires_approval:
          type: boolean
        expires_at:
          type: string
          format: date-time
        redacted_diff:
          type: array
          items:
            type: object
            additionalProperties: true
        intent_hash:
          type: string
        warnings:
          type: array
          items:
            type: string
        block_reasons:
          type: array
          items:
            type: string
    SubmitChange:
      type: object
      additionalProperties: false
      required:
      - preview_id
      - intent_hash
      properties:
        preview_id:
          type: string
          format: uuid
        intent_hash:
          type: string
        justification:
          type: string
    ChangeJob:
      type: object
      required:
      - job_id
      - state
      - device_id
      properties:
        job_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - draft
          - previewed
          - pending_approval
          - approved
          - dispatched
          - backend_accepted
          - device_pending
          - verifying
          - succeeded
          - failed
          - expired
          - unknown
          - cancelled
        protocol:
          type: string
          enum:
          - tr069
          - tr369
        external_task_id:
          type: string
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
        redacted_changes:
          type: array
          items:
            type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Tenant:
      name: X-Workspace-ID
      in: header
      required: true
      description: Server MUST validate membership and derive tenant context; header
        is NOT trusted alone
      schema:
        type: string
        format: uuid
    OntID:
      name: ontId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Snapshot/form revision; optimistic concurrency
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128

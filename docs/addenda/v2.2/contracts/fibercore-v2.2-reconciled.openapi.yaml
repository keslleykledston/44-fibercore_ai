openapi: 3.1.0
info:
  title: FiberCore AI v2.2 — contrato reconciliado (parcial, em evolução)
  version: 2.2.0-reconciled-draft
  description: >-
    Reconcilia contracts/fibercore-v2.2-additive.openapi.yaml com a API real. x-status=implemented só quando o caminho já está em
    contracts/fibercore-v2.openapi.yaml; planned = ainda NÃO existe (não é promessa de data). Todo endpoint exige auth, membership e RBAC.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /customers/{customer_id}/context:
    get:
      operationId: getCustomerContext
      x-fc22-id: FC22-004
      x-status: implemented
      summary: Visão do cliente com fonte e frescor por bloco (read-only; dado pessoal exige customers:read e é auditado; flag customer_context). Só ONUs de associação APROVADA; CPE só com vínculo CONFIRMADO por pessoa; incidente só com incidents:read (senão incident_hidden). status = unknown (sem ONU aprovada) > stale > partial (ONU sem CPE confirmado) > complete. Nunca expõe hmac do documento, ids do ERP nem segredos do CPE
      parameters: [{in: path, name: customer_id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: "CustomerContext (status complete|partial|stale|unknown)"}
        '403': {description: "Sem permissão, ou feature_disabled (flag customer_context desligada para o provedor)"}
        '404': {description: Cliente inexistente ou de outro provedor}
        '422': {description: customer_id inválido}
  /onu-cpe-links/suggest:
    post:
      operationId: suggestOnuCpeLinks
      x-fc22-id: FC22-004
      x-status: implemented
      summary: Cria SUGESTÕES ONU↔CPE onde serial da ONU = serial canônico do CPE (regra serial_equal, confiança 0.50; 0.20 se o serial existe em mais de uma OLT). Idempotente; nunca confirma. associations:review + flag onu_cpe_links
      responses:
        '201': {description: "{created, examined, limit_reached} (teto 1000 por chamada)"}
        '403': {description: "Sem permissão ou feature_disabled"}
  /onu-cpe-links:
    get:
      operationId: listOnuCpeLinks
      x-fc22-id: FC22-004
      x-status: implemented
      summary: Lista vínculos ONU↔CPE (status suggested|confirmed|rejected, confiança, evidência). inventory:read + flag onu_cpe_links
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [suggested, confirmed, rejected]}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200': {description: Lista de vínculos}
        '403': {description: "Sem permissão ou feature_disabled"}
        '422': {description: Parâmetro inválido}
  /onu-cpe-links/{link_id}/confirm:
    post:
      operationId: confirmOnuCpeLink
      x-fc22-id: FC22-004
      x-status: implemented
      summary: Pessoa confirma a sugestão (auditado + evento onu_cpe_link.confirmed). 409 se já revisada, ambígua, ou se a ONU/CPE já tem vínculo confirmado (índices únicos parciais)
      parameters: [{in: path, name: link_id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: "{id, status}"}
        '403': {description: "Sem permissão ou feature_disabled"}
        '404': {description: Vínculo inexistente}
        '409': {description: Conflito}
  /onu-cpe-links/{link_id}/reject:
    post:
      operationId: rejectOnuCpeLink
      x-fc22-id: FC22-004
      x-status: implemented
      summary: Pessoa rejeita a sugestão (auditado + evento onu_cpe_link.rejected); a regra não volta a sugerir o mesmo par
      parameters: [{in: path, name: link_id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: "{id, status}"}
        '403': {description: "Sem permissão ou feature_disabled"}
        '404': {description: Vínculo inexistente}
        '409': {description: Já revisado}
  /cpes/{cpeId}/capabilities:
    get:
      operationId: getCpeCapabilities
      x-fc22-id: FC22-002
      x-status: implemented
      summary: Era documentada sem handler; implementada no PR 35. Capacidades pelo perfil vendor/model/firmware do CPE; sem registro = unknown (schema Capability vigente + campos aditivos)
      parameters: [{in: path, name: cpeId, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: "[Capability] do contrato vigente: name, status supported|unsupported|unknown, protocol, certification, model, firmware"}
        '404': {description: CPE inexistente ou de outro provedor}
  /olts/{oltId}/capabilities:
    get:
      operationId: getOltCapabilities
      x-fc22-id: FC22-002
      x-status: implemented
      summary: Mesmo contrato para OLT (perfil da OLT; ONU usa o perfil da sua OLT). Substitui o recurso genérico /devices/{id} da proposta, que não existe no modelo
      parameters: [{in: path, name: oltId, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: "[Capability]"}
        '404': {description: OLT inexistente ou de outro provedor}
  /diagnostics/runs:
    post:
      operationId: createDiagnosticRun
      x-fc22-id: FC22-006
      x-status: planned
      summary: Executa regras determinísticas versionadas (sem mutação de equipamento) e persiste a execução
      responses:
        '201': {description: "{run_id, rule_version, findings[{status observed|inferred|unknown, evidence_refs}]}"}
  /network/topology:
    get:
      operationId: getNetworkTopology
      x-fc22-id: FC22-010
      x-status: planned
      summary: Relações técnicas com evidência e confiança; não confirmadas ficam pendentes
      responses:
        '200': {description: Lista de NetworkLink}
  /qoe/{subject_id}:
    get:
      operationId: getQoe
      x-fc22-id: FC22-011
      x-status: planned
      summary: Score por algoritmo versionado ou insufficient_data com score null (nunca 0 imputado)
      parameters: [{in: path, name: subject_id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Lista de QoeScore}
  /jobs/preview:
    post:
      operationId: previewJob
      x-fc22-id: FC22-014
      x-status: implemented
      summary: JÁ EXISTE. É o preview/aprovação de workflows (motor de jobs); a proposta /workflow-previews é descartada para não duplicar
      responses:
        '201': {description: Job em PREVIEWED}
  /workflow-definitions:
    get:
      operationId: listWorkflowDefinitions
      x-fc22-id: FC22-014
      x-status: planned
      summary: Catálogo versionado de intenções; não concede permissão de execução (execução = /v1/jobs)
      responses:
        '200': {description: Lista de WorkflowDefinition}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}

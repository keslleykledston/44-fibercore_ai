openapi: 3.1.0
info:
  title: FiberCore AI v2.2 — contrato reconciliado (parcial, em evolução)
  version: 2.2.0-reconciled-draft
  description: >-
    Reconcilia contracts/fibercore-v2.2-additive.openapi.yaml com a API real. x-status=implemented só quando o caminho já está em
    contracts/fibercore-v2.openapi.yaml; planned = ainda NÃO existe (não é promessa de data). Todo endpoint exige auth, membership e RBAC.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /customers/{customer_id}/context:
    get:
      operationId: getCustomerContext
      x-fc22-id: FC22-004
      x-status: planned
      summary: Visão do cliente com fonte e frescor por campo (read-only; dado pessoal exige customers:read e é auditado)
      parameters: [{in: path, name: customer_id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: "CustomerContext (status complete|partial|stale|unknown)"}
        '403': {description: Sem permissão}
        '404': {description: Cliente inexistente ou de outro provedor}
  /cpes/{cpeId}/capabilities:
    get:
      operationId: getCpeCapabilities
      x-fc22-id: FC22-002
      x-status: planned
      summary: DOCUMENTADA no contrato vigente, SEM handler no código. Capacidades pelo perfil vendor/model/firmware do CPE; operação sem registro = unknown (schema Capability vigente)
      parameters: [{in: path, name: cpeId, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: "[Capability] do contrato vigente: name, status supported|unsupported|unknown, protocol, certification, model, firmware"}
        '404': {description: CPE inexistente ou de outro provedor}
  /olts/{oltId}/capabilities:
    get:
      operationId: getOltCapabilities
      x-fc22-id: FC22-002
      x-status: planned
      summary: Mesmo contrato para OLT (perfil da OLT; ONU usa o perfil da sua OLT). Substitui o recurso genérico /devices/{id} da proposta, que não existe no modelo
      parameters: [{in: path, name: oltId, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: "[Capability]"}
        '404': {description: OLT inexistente ou de outro provedor}
  /diagnostics/runs:
    post:
      operationId: createDiagnosticRun
      x-fc22-id: FC22-006
      x-status: planned
      summary: Executa regras determinísticas versionadas (sem mutação de equipamento) e persiste a execução
      responses:
        '201': {description: "{run_id, rule_version, findings[{status observed|inferred|unknown, evidence_refs}]}"}
  /network/topology:
    get:
      operationId: getNetworkTopology
      x-fc22-id: FC22-010
      x-status: planned
      summary: Relações técnicas com evidência e confiança; não confirmadas ficam pendentes
      responses:
        '200': {description: Lista de NetworkLink}
  /qoe/{subject_id}:
    get:
      operationId: getQoe
      x-fc22-id: FC22-011
      x-status: planned
      summary: Score por algoritmo versionado ou insufficient_data com score null (nunca 0 imputado)
      parameters: [{in: path, name: subject_id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Lista de QoeScore}
  /jobs/preview:
    post:
      operationId: previewJob
      x-fc22-id: FC22-014
      x-status: implemented
      summary: JÁ EXISTE. É o preview/aprovação de workflows (motor de jobs); a proposta /workflow-previews é descartada para não duplicar
      responses:
        '201': {description: Job em PREVIEWED}
  /workflow-definitions:
    get:
      operationId: listWorkflowDefinitions
      x-fc22-id: FC22-014
      x-status: planned
      summary: Catálogo versionado de intenções; não concede permissão de execução (execução = /v1/jobs)
      responses:
        '200': {description: Lista de WorkflowDefinition}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}

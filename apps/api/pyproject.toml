[project]
name = "fibercore-api"
version = "0.1.0"
description = "FiberCore AI API core (Sprint 0 foundation)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic[email]>=2,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<46",
  "nats-py>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7,<1", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E702", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]
"alembic/versions/*" = ["S608"]

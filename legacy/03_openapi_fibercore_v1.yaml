openapi: 3.0.3
info:
  title: FiberCore AI API
  version: 1.0.0
  description: >
    API Core do FiberCore AI para gestão FTTH multi-tenant.
    Esta especificação cobre a Fase 1 do MVP: cadastro de OLT,
    inventário de ONUs, importação CSV de clientes, associação ONU x Cliente
    e reboot de ONU autorizado.
servers:
  - url: https://api.fibercore.local/v1
    description: Produção
  - url: http://localhost:8000/v1
    description: Desenvolvimento local
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Tenants
  - name: Dashboard
  - name: OLTs
  - name: ONUs
  - name: Customers
  - name: Imports
  - name: Associations
  - name: Automations
  - name: Incidents
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Autenticar usuário
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Auth]
      summary: Obter usuário autenticado
      operationId: getCurrentUser
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tenants/current:
    get:
      tags: [Tenants]
      summary: Obter tenant atual
      operationId: getCurrentTenant
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Tenant atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Obter resumo operacional FTTH
      operationId: getDashboardSummary
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Resumo operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
  /olts:
    get:
      tags: [OLTs]
      summary: Listar OLTs
      operationId: listOlts
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OltStatus'
        - name: vendor
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Busca por nome, hostname ou IP
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada de OLTs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OltListResponse'
    post:
      tags: [OLTs]
      summary: Cadastrar OLT
      operationId: createOlt
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOltRequest'
      responses:
        '201':
          description: OLT cadastrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Olt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /olts/{olt_id}:
    get:
      tags: [OLTs]
      summary: Obter detalhes da OLT
      operationId: getOlt
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OltId'
      responses:
        '200':
          description: Detalhes da OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Olt'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [OLTs]
      summary: Atualizar OLT
      operationId: updateOlt
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OltId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOltRequest'
      responses:
        '200':
          description: OLT atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Olt'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [OLTs]
      summary: Remover OLT
      operationId: deleteOlt
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OltId'
        - name: force
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: OLT removida
        '409':
          $ref: '#/components/responses/Conflict'
  /olts/{olt_id}/collect:
    post:
      tags: [OLTs]
      summary: Solicitar coleta da OLT
      operationId: requestOltCollection
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OltId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectOltRequest'
      responses:
        '202':
          description: Coleta solicitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobAccepted'
  /olts/{olt_id}/pon-ports:
    get:
      tags: [OLTs]
      summary: Listar portas PON de uma OLT
      operationId: listOltPonPorts
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OltId'
      responses:
        '200':
          description: Lista de portas PON
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PonPort'
  /onus:
    get:
      tags: [ONUs]
      summary: Listar inventário de ONUs
      operationId: listOnus
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: olt_id
          in: query
          schema:
            type: string
            format: uuid
        - name: pon_port_id
          in: query
          schema:
            type: string
            format: uuid
        - name: cto_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OnuStatus'
        - name: association_status
          in: query
          schema:
            $ref: '#/components/schemas/AssociationStatus'
        - name: signal_level
          in: query
          schema:
            type: string
            enum: [excellent, good, warning, critical, severe]
        - name: q
          in: query
          description: Busca por serial, MAC, cliente, contrato ou login PPPoE
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada de ONUs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnuListResponse'
  /onus/{onu_id}:
    get:
      tags: [ONUs]
      summary: Obter detalhes técnicos da ONU
      operationId: getOnu
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OnuId'
      responses:
        '200':
          description: Detalhes da ONU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Onu'
        '404':
          $ref: '#/components/responses/NotFound'
  /onus/{onu_id}/360:
    get:
      tags: [ONUs]
      summary: Obter visão ONU 360
      operationId: getOnu360
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OnuId'
      responses:
        '200':
          description: Visão ONU 360
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Onu360'
  /onus/{onu_id}/metrics:
    get:
      tags: [ONUs]
      summary: Consultar histórico de métricas da ONU
      operationId: getOnuMetrics
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OnuId'
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: bucket
          in: query
          schema:
            type: string
            enum: [raw, 5m, 1h, 1d]
            default: raw
      responses:
        '200':
          description: Métricas da ONU
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OnuMetricSample'
  /onus/{onu_id}/actions/reboot:
    post:
      tags: [ONUs, Automations]
      summary: Solicitar reboot autorizado da ONU
      operationId: requestOnuReboot
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OnuId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebootOnuRequest'
      responses:
        '202':
          description: Solicitação de reboot criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRun'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /customers:
    get:
      tags: [Customers]
      summary: Listar clientes
      operationId: listCustomers
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CustomerStatus'
        - name: financial_status
          in: query
          schema:
            $ref: '#/components/schemas/FinancialStatus'
        - name: q
          in: query
          description: Busca por nome, contrato, telefone, login ou ID ERP
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
    post:
      tags: [Customers]
      summary: Criar cliente manualmente
      operationId: createCustomer
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Cliente criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
  /customers/{customer_id}:
    get:
      tags: [Customers]
      summary: Obter cliente
      operationId: getCustomer
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
  /customers/{customer_id}/contracts:
    get:
      tags: [Customers]
      summary: Listar contratos do cliente
      operationId: listCustomerContracts
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Contratos do cliente
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'
  /imports/customers/csv:
    post:
      tags: [Imports, Customers]
      summary: Importar clientes por CSV
      operationId: importCustomersCsv
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerCsvImportRequest'
      responses:
        '202':
          description: Importação aceita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400':
          $ref: '#/components/responses/BadRequest'
  /imports/{import_job_id}:
    get:
      tags: [Imports]
      summary: Consultar status de importação
      operationId: getImportJob
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportJobId'
      responses:
        '200':
          description: Status da importação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
  /imports/{import_job_id}/rows:
    get:
      tags: [Imports]
      summary: Listar linhas processadas de uma importação
      operationId: listImportJobRows
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportJobId'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, success, error, skipped]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Linhas da importação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobRowListResponse'
  /associations/onu-customer:
    post:
      tags: [Associations]
      summary: Associar ONU a cliente/contrato
      operationId: associateOnuCustomer
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssociateOnuCustomerRequest'
      responses:
        '201':
          description: Associação criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnuCustomerAssociation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /associations/onu-customer/suggestions:
    get:
      tags: [Associations]
      summary: Listar sugestões de associação ONU x Cliente
      operationId: listAssociationSuggestions
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: min_score
          in: query
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 100
            default: 60
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AssociationStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Sugestões de associação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociationSuggestionListResponse'
  /associations/onu-customer/{association_id}:
    delete:
      tags: [Associations]
      summary: Remover associação ONU x Cliente
      operationId: removeOnuCustomerAssociation
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: association_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Associação removida
  /automations:
    get:
      tags: [Automations]
      summary: Listar automações
      operationId: listAutomationRuns
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AutomationStatus'
        - name: automation_type
          in: query
          schema:
            $ref: '#/components/schemas/AutomationType'
        - name: target_entity_type
          in: query
          schema:
            $ref: '#/components/schemas/EntityType'
        - name: target_entity_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada de automações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRunListResponse'
  /automations/{automation_run_id}:
    get:
      tags: [Automations]
      summary: Obter automação
      operationId: getAutomationRun
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AutomationRunId'
      responses:
        '200':
          description: Automação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRun'
  /automations/{automation_run_id}/approve:
    post:
      tags: [Automations]
      summary: Aprovar automação pendente
      operationId: approveAutomationRun
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AutomationRunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveAutomationRequest'
      responses:
        '200':
          description: Automação aprovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRun'
  /automations/{automation_run_id}/cancel:
    post:
      tags: [Automations]
      summary: Cancelar automação
      operationId: cancelAutomationRun
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AutomationRunId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAutomationRequest'
      responses:
        '200':
          description: Automação cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRun'
  /incidents:
    get:
      tags: [Incidents]
      summary: Listar incidentes
      operationId: listIncidents
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IncidentStatus'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/SeverityLevel'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista paginada de incidentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentListResponse'
  /incidents/{incident_id}:
    get:
      tags: [Incidents]
      summary: Obter incidente
      operationId: getIncident
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Incidente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: true
      description: UUID do tenant ativo
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Chave para evitar duplicidade de operações sensíveis
      schema:
        type: string
        maxLength: 128
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    OltId:
      name: olt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OnuId:
      name: onu_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportJobId:
      name: import_job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AutomationRunId:
      name: automation_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Sem permissão
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflito de estado ou duplicidade
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@isp.com.br
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required: [id, tenant_id, name, email, permissions]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        is_tenant_admin:
          type: boolean
        permissions:
          type: array
          items:
            type: string
    Tenant:
      type: object
      required: [id, name, status, timezone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        legal_name:
          type: string
          nullable: true
        document:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, trial, suspended, cancelled]
        plan_name:
          type: string
          nullable: true
        timezone:
          type: string
          example: America/Manaus
    OltStatus:
      type: string
      enum: [unknown, online, offline, degraded, maintenance]
    OnuStatus:
      type: string
      enum: [unknown, online, offline, los, dying_gasp, disabled, unauthorized]
    PonStatus:
      type: string
      enum: [unknown, online, offline, degraded, saturated, maintenance]
    CustomerStatus:
      type: string
      enum: [active, suspended, cancelled, pending_activation, pending_installation, unknown]
    FinancialStatus:
      type: string
      enum: [paid, overdue, blocked, negotiation, unknown]
    ContractStatus:
      type: string
      enum: [active, suspended, cancelled, pending_activation, pending_installation, unknown]
    SeverityLevel:
      type: string
      enum: [info, warning, minor, major, critical]
    IncidentStatus:
      type: string
      enum: [open, investigating, field_dispatched, resolved, closed, cancelled]
    AutomationStatus:
      type: string
      enum: [requested, pending_approval, approved, running, success, failed, cancelled, rollback_running, rolled_back]
    AutomationType:
      type: string

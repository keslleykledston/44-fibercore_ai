name: CI
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: fibercore, POSTGRES_PASSWORD: ci_admin_pw_only, POSTGRES_DB: fibercore_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fibercore" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: NATS JetStream
        run: docker run -d --name nats -p 127.0.0.1:4222:4222 nats:2.11-alpine -js
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e 'apps/api[dev]' && pip install pyyaml
      - run: python tests/validate_kit.py
      - run: python tests/validate_help.py
      - run: ruff check apps/api
      - run: cd apps/api && python -m pytest -q
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://fibercore:ci_admin_pw_only@127.0.0.1:5432/fibercore_test
          TEST_NATS_URL: nats://127.0.0.1:4222
      - name: Compose syntax
        run: |
          printf 'FIBERCORE_DB_PASSWORD=ci\nFIBERCORE_APP_DB_PASSWORD=ci\nFIBERCORE_WORKER_DB_PASSWORD=ci\nFIBERCORE_RBAC_DB_PASSWORD=ci\nFIBERCORE_JWT_SECRET=%s\n' "$(openssl rand -hex 32)" > .env.dev
          docker compose --env-file .env.dev -f infra/compose/compose.yaml config --quiet
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m venv .venv && .venv/bin/pip install -q pip-audit cyclonedx-bom
      - run: VENV=.venv scripts/sbom.sh
      - uses: actions/upload-artifact@v4
        with: {name: sbom, path: build/sbom}
      - name: Build image and scan
        run: |
          docker build -f apps/api/Dockerfile -t fibercore-api:ci .
          docker run --rm fibercore-api:ci python -c 'import app.main'   # imagem realmente importa o app (lock completo)
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed fibercore-api:ci
  edge-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.22'}
      - run: cd agents/edge && go vet ./... && go test -race ./...
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m venv .venv && .venv/bin/pip install -q httpx
      - run: cd apps/web && npm ci --no-audit --no-fund && npx tsc --noEmit && npx playwright install --with-deps chromium
      - name: E2E (funcional + a11y + capturas) contra a stack real
        run: VENV_PY=.venv/bin/python scripts/e2e.sh
      - name: Capturas versionadas devem estar atualizadas
        run: git diff --stat --exit-code -- docs/help/assets || echo "::warning::capturas mudaram; revisar visualmente e commitar no PR"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: help-screenshots, path: docs/help/assets}

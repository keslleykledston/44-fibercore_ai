name: FiberCore Kit Checks
on:
  push:
  pull_request:
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install kit test dependencies
        run: pip install 'PyYAML>=6,<7' 'pytest>=8,<10' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'psycopg[binary]>=3.2,<4'
      - name: Validate manifest and JSON
        run: python tests/validate_kit.py
      - name: Unit demo tests
        run: cd starter/apps/api && PYTHONPATH=. python -m pytest -q
      - name: Compose syntax
        env:
          FIBERCORE_DB_PASSWORD: ci_example_only
        run: docker compose -f infra/compose/compose.yaml config --quiet
